name: Build Dynamic APK

on:
  repository_dispatch:
    types: [build_dynamic_apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Prepare Payload & Run Generator
        run: |
          echo '${{ toJson(github.event.client_payload) }}' > payload.json
          python generate_project.py

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew || gradle wrapper

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Send APK to Telegram
        run: |
          CHAT_ID="${{ github.event.client_payload.chat_id }}"
          APP_NAME="${{ github.event.client_payload.app_name }}"
          BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)

          if [ -f "$APK_PATH" ]; then
            curl -F chat_id="$CHAT_ID" \
                 -F document=@"$APK_PATH" \
                 -F caption="✅ *Aplikasi Selesai!*%0A📱 Nama: $APP_NAME%0A🎉 Berhasil dirakit via Universal Native Shell." \
                 -F parse_mode="Markdown" \
                 https://api.telegram.org/bot$BOT_TOKEN/sendDocument
          else
            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
                 -d chat_id="$CHAT_ID" \
                 -d text="❌ Gagal menemukan file APK hasil kompilasi."
          fi
