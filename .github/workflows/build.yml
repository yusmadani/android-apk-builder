name: Build Dynamic Android APK

on:
  repository_dispatch:
    types: [build_dynamic_apk]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Scaffold Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/stb/dynamicapp
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap

          # 1. gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF
          cp gradle.properties app/gradle.properties

          # 2. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DynamicAndroidApp"
          include ':app'
          EOF

          # 3. build.gradle (Root)
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.stb.dynamicapp'
              compileSdk 34

              defaultConfig {
                  applicationId "com.stb.dynamicapp"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # 5. AndroidManifest.xml (Ditulis langsung via Base64 bersih tanpa masalah spasi/indentasi)
          echo "" | base64 -d > app/src/main/AndroidManifest.xml

      - name: Inject Dynamic App Code, Themed Icon & Sanitize via Python
        env:
          PAYLOAD_DATA: ${{ toJson(github.event.client_payload) }}
        run: |
          pip install pillow --quiet
          python3 - << 'PYEOF'
          import os, json, base64, shutil, re
          import xml.etree.ElementTree as ET
          from PIL import Image, ImageDraw

          if os.path.exists("app/src/main/res/values"):
              shutil.rmtree("app/src/main/res/values")

          raw = os.environ.get("PAYLOAD_DATA", "{}")
          data = json.loads(raw)
          title = data.get("app_name", "DynamicApp").strip()

          # ==========================================
          # 1. TULIS JAVA & SUNTIKKAN AUTO-IMPORT LENGKAP
          # ==========================================
          j_b64 = data.get("java_code_b64", "")
          j_code = base64.b64decode(j_b64).decode("utf-8", "ignore")

          auto_imports = """package com.stb.dynamicapp;

          import android.app.Activity;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.*;
          import android.content.Intent;
          """
          if "package com.stb.dynamicapp;" in j_code:
              j_code = j_code.replace("package com.stb.dynamicapp;", auto_imports.strip())
          else:
              j_code = auto_imports.strip() + "\n" + j_code

          with open("app/src/main/java/com/stb/dynamicapp/MainActivity.java", "w", encoding="utf-8") as f:
              f.write(j_code)

          # ==========================================
          # 2. SANITASI & VALIDASI LAYOUT XML
          # ==========================================
          x_b64 = data.get("xml_code_b64", "")
          x_code = base64.b64decode(x_b64).decode("utf-8", "ignore").strip()
          if x_code.startswith("\ufeff"):
              x_code = x_code[1:]

          # Escape karakter & mentah menjadi &
          x_code = re.sub(r'&(?!(amp|lt|gt|quot|apos);)', '&', x_code)

          fallback_xml = """
          
              
          """

          is_valid_xml = False
          if x_code and ("Layout" in x_code or "View" in x_code):
              try:
                  ET.fromstring(x_code)
                  is_valid_xml = True
              except Exception as err:
                  print(f"[WARN] Sintaks XML tidak valid ({err}). Menggunakan fallback layout.")

          if not is_valid_xml:
              x_code = fallback_xml

          with open("app/src/main/res/layout/activity_main.xml", "w", encoding="utf-8") as f:
              f.write(x_code)

          # ==========================================
          # 3. BUAT IKON LAUNCHER TEMATIK HD
          # ==========================================
          title_lower = title.lower()
          if any(k in title_lower for k in ["gym", "workout", "fitness", "dumbel", "dumbbell", "katrol", "pulley", "otot"]):
              bg_color, inner_bg, icon_type = (216, 67, 21), (230, 81, 0), "gym"
          elif any(k in title_lower for k in ["kalkulator", "hitung", "math", "kasir"]):
              bg_color, inner_bg, icon_type = (25, 118, 210), (33, 150, 243), "calc"
          elif any(k in title_lower for k in ["game", "ketuk", "tap", "skor", "play", "main"]):
              bg_color, inner_bg, icon_type = (123, 31, 162), (156, 39, 176), "game"
          elif any(k in title_lower for k in ["catatan", "note", "memo", "todo", "tugas", "list"]):
              bg_color, inner_bg, icon_type = (245, 124, 0), (255, 152, 0), "notes"
          elif any(k in title_lower for k in ["stres", "relaks", "tenang", "sehat", "meditasi", "hati", "pereda"]):
              bg_color, inner_bg, icon_type = (0, 121, 107), (0, 150, 136), "zen"
          elif any(k in title_lower for k in ["musik", "lagu", "audio", "suara"]):
              bg_color, inner_bg, icon_type = (211, 47, 47), (244, 67, 54), "music"
          else:
              bg_color, inner_bg, icon_type = (48, 63, 159), (63, 81, 181), "star"

          img = Image.new("RGBA", (512, 512), (0, 0, 0, 0))
          draw = ImageDraw.Draw(img)
          draw.rounded_rectangle([24, 24, 488, 488], radius=115, fill=bg_color)
          draw.ellipse([64, 64, 448, 448], fill=inner_bg)
          white = (255, 255, 255, 255)

          if icon_type == "gym":
              draw.rounded_rectangle([190, 244, 322, 268], radius=8, fill=white)
              draw.rounded_rectangle([140, 180, 190, 332], radius=14, fill=white)
              draw.rounded_rectangle([110, 205, 140, 307], radius=10, fill=white)
              draw.rounded_rectangle([322, 180, 372, 332], radius=14, fill=white)
              draw.rounded_rectangle([372, 205, 402, 307], radius=10, fill=white)
          elif icon_type == "calc":
              draw.rounded_rectangle([130, 110, 382, 402], radius=28, fill=(255, 255, 255, 230))
              draw.rounded_rectangle([155, 135, 357, 195], radius=12, fill=bg_color)
              for y in [220, 280, 340]:
                  for x in [160, 230]:
                      draw.rounded_rectangle([x, y, x + 52, y + 42], radius=10, fill=inner_bg)
              draw.rounded_rectangle([300, 220, 352, 262], radius=10, fill=inner_bg)
              draw.rounded_rectangle([300, 280, 352, 382], radius=10, fill=(255, 87, 34, 255))
          elif icon_type == "game":
              draw.rounded_rectangle([100, 190, 412, 325], radius=60, fill=white)
              draw.ellipse([100, 250, 190, 380], fill=white)
              draw.ellipse([322, 250, 412, 380], fill=white)
              draw.rounded_rectangle([165, 220, 185, 290], radius=4, fill=bg_color)
              draw.rounded_rectangle([150, 235, 200, 275], radius=4, fill=bg_color)
              draw.ellipse([335, 225, 355, 245], fill=(244, 67, 54, 255))
              draw.ellipse([335, 265, 355, 285], fill=(76, 175, 80, 255))
              draw.ellipse([315, 245, 335, 265], fill=(33, 150, 243, 255))
              draw.ellipse([355, 245, 375, 265], fill=(255, 193, 7, 255))
          elif icon_type == "notes":
              draw.rounded_rectangle([145, 110, 367, 402], radius=24, fill=white)
              draw.rounded_rectangle([145, 110, 367, 165], radius=16, fill=(211, 47, 47, 255))
              for bx in [190, 256, 322]:
                  draw.ellipse([bx - 10, 125, bx + 10, 145], fill=white)
              for gy in [210, 260, 310, 360]:
                  draw.rounded_rectangle([175, gy, 195, gy + 20], radius=5, fill=inner_bg)
                  draw.rounded_rectangle([215, gy + 3, 335, gy + 17], radius=6, fill=(189, 189, 189, 255))
          elif icon_type == "zen":
              draw.ellipse([140, 160, 270, 290], fill=white)
              draw.ellipse([242, 160, 372, 290], fill=white)
              draw.polygon([(143, 245), (369, 245), (256, 385)], fill=white)
              draw.ellipse([175, 190, 210, 225], fill=inner_bg)
          elif icon_type == "music":
              draw.ellipse([140, 310, 215, 385], fill=white)
              draw.ellipse([275, 270, 350, 345], fill=white)
              draw.rectangle([195, 160, 215, 345], fill=white)
              draw.rectangle([330, 120, 350, 305], fill=white)
              draw.polygon([(195, 160), (350, 120), (350, 175), (195, 215)], fill=white)
          else:
              pts = []
              for i in range(10):
                  ang = i * 3.14159 / 5 - 3.14159 / 2
                  r = 145 if i % 2 == 0 else 70
                  pts.append((256 + r * math.cos(ang), 256 + r * math.sin(ang)))
              draw.polygon(pts, fill=white)
              draw.ellipse([230, 230, 282, 282], fill=bg_color)

          icon_final = img.resize((192, 192), Image.LANCZOS)
          icon_final.save("app/src/main/res/drawable/ic_launcher.png", "PNG")
          icon_final.save("app/src/main/res/mipmap/ic_launcher.png", "PNG")

          # ==========================================
          # 4. SINKRONISASI MANIFEST (LABEL AMAN DARI SIMBOL LIAR)
          # ==========================================
          # Hanya izinkan alfanumerik dan spasi, maksimal 25 karakter
          clean_title = re.sub(r'[^a-zA-Z0-9 ]', '', title).strip()
          clean_title = clean_title[:25] if clean_title else "HomeGymTracker"

          manifest_file = "app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_file):
              with open(manifest_file, "r", encoding="utf-8") as mf:
                  m_text = mf.read()
              m_text = m_text.replace('android:label="DynamicApp"', f'android:label="{clean_title}"')
              with open(manifest_file, "w", encoding="utf-8") as mf:
                  mf.write(m_text)

          print(f"✅ Injeksi sukses dengan label aplikasi: {clean_title}")
          PYEOF

      - name: Setup Gradle Wrapper and Build APK
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true --stacktrace 2>&1 | tee build_output.log

      - name: Send APK to Telegram
        if: success()
        env:
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          APP_TITLE: ${{ github.event.client_payload.app_name }}
        run: |
          python3 - << 'EOF'
          import os, glob, re, requests

          token = os.environ.get("BOT_TOKEN", "").strip()
          chat_id = os.environ.get("CHAT_ID", "").strip()
          title = os.environ.get("APP_TITLE", "Aplikasi").strip()

          if not token:
              print("ERROR: Secret TELEGRAM_TOKEN belum disetel!")
              exit(1)

          apk_files = glob.glob("app/build/outputs/apk/debug/*.apk")
          if not apk_files:
              print("ERROR: File APK tidak ditemukan di folder output!")
              exit(1)

          original_apk = apk_files[0]
          safe_name = re.sub(r'[^a-zA-Z0-9_-]', '_', title).strip('_') or "DynamicApp"
          new_file_name = f"{safe_name}.apk"
          new_apk_path = os.path.join(os.path.dirname(original_apk), new_file_name)

          if original_apk != new_apk_path:
              os.rename(original_apk, new_apk_path)

          url = f"https://api.telegram.org/bot{token}/sendDocument"
          payload = {
              "chat_id": chat_id,
              "caption": f"✅ *{title}* berhasil dikompilasi!\n📁 File: `{new_file_name}`\n🎨 Ikon & tema telah disesuaikan.",
              "parse_mode": "Markdown"
          }

          with open(new_apk_path, "rb") as f:
              files = {"document": (new_file_name, f, "application/vnd.android.package-archive")}
              r = requests.post(url, data=payload, files=files, timeout=90)

          if not r.json().get("ok"):
              print("Telegram menolak pengiriman file!")
              exit(1)

          print(f"✅ APK {new_file_name} berhasil dikirim ke Telegram!")
          EOF

      - name: Notify Failure to Telegram with Extracted Error
        if: failure()
        env:
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          python3 - << 'EOF'
          import os, requests

          token = os.environ.get("BOT_TOKEN", "").strip()
          chat_id = os.environ.get("CHAT_ID", "").strip()

          if not token or not chat_id:
              exit(0)

          error_lines = []
          if os.path.exists("build_output.log"):
              with open("build_output.log", "r", encoding="utf-8", errors="ignore") as f:
                  lines = f.readlines()

              for idx, line in enumerate(lines):
                  if "error:" in line.lower() or "failed" in line.lower() or "exception:" in line.lower():
                      start = max(0, idx - 1)
                      end = min(len(lines), idx + 4)
                      for l in lines[start:end]:
                          if l.strip() and l not in error_lines and "org.gradle." not in l:
                              error_lines.append(l.strip())

          error_snippet = "\n".join(error_lines[:15]) if error_lines else "Cek log tab GitHub Actions untuk detail."

          msg = f"❌ *Kompilasi APK Gagal!*\n\n*Detail Error:*\n```\n{error_snippet[:3500]}\n```"
          requests.post(f"https://api.telegram.org/bot{token}/sendMessage", data={
              "chat_id": chat_id,
              "text": msg,
              "parse_mode": "Markdown"
          })
          EOF
