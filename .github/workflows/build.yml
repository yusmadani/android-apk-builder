name: Compile and Send APK

on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Unduh kerangka template Android resmi sederhana yang siap di-build
      - name: Setup Basic Android Project
        run: |
          if [ ! -f "gradlew" ]; then
            git clone --depth 1 https://github.com/android/architecture-samples.git temp-project
            mv temp-project/* temp-project/.* . 2>/dev/null || true
            rm -rf temp-project
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Send APK to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          APP_NAME: ${{ github.event.client_payload.app_name }}
        run: |
          APK_PATH=$(find . -name "*debug.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "Mengirim APK \(APK_PATH ke Chat ID\)CHAT_ID..."
            curl -F chat_id="$CHAT_ID" \
                 -F document=@"$APK_PATH" \
                 -F caption="Build berhasil untuk: ${APP_NAME:-Aplikasi Android}!" \
                 https://api.telegram.org/bot$BOT_TOKEN/sendDocument
          else
            echo "File APK tidak ditemukan!"
            exit 1
          fi
