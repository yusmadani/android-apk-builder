name: Build Android APK

on:
  repository_dispatch:
    types: [build_apk]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare payload
        shell: python
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          import os, json, base64, pathlib
          payload = json.loads(os.environ["CLIENT_PAYLOAD"])
          b64 = payload.get("payload", "")
          if not b64:
              raise SystemExit("Missing payload in client_payload")
          try:
              raw = base64.b64decode(b64).decode("utf-8", errors="replace")
          except Exception as e:
              raise SystemExit(f"Base64 decode failed: {e}")
          pathlib.Path("payload.json").write_text(raw, encoding="utf-8")
          print("Payload bytes:", len(raw))

      - name: Generate Android project
        shell: python
        run: |
          import subprocess, sys
          r = subprocess.run([sys.executable, "scripts/generate_project.py"], capture_output=True, text=True)
          print(r.stdout)
          print(r.stderr, file=sys.stderr)
          if r.returncode != 0:
              # simpan error ringkas untuk step berikutnya
              open("build_error.txt","w").write((r.stdout or "") + "\n" + (r.stderr or ""))
              sys.exit(r.returncode)

      - name: Build with Gradle
        id: gradle
        continue-on-error: true
        run: |
          cd project
          chmod +x ./gradlew || true
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle.log
          exit ${PIPESTATUS[0]}

      - name: Summarize error (if any)
        if: steps.gradle.outcome == 'failure'
        shell: python
        run: |
          import re, pathlib
          log = pathlib.Path("gradle.log").read_text(errors="replace")
          # ambil 40 baris error penting
          lines = log.splitlines()
          keys = ("error:", "FAILURE:", "What went wrong", "Execution failed", "Caused by", ".java:", ".xml:")
          picked = [l for l in lines if any(k in l for k in keys)]
          tail = picked[-40:] if picked else lines[-40:]
          msg = "\n".join(tail)[:3500]
          pathlib.Path("error_summary.txt").write_text(msg or "Unknown build failure", encoding="utf-8")
          print(msg)

      - name: Send APK to Telegram
        if: steps.gradle.outcome == 'success'
        shell: python
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          import os, glob, json, urllib.request, mimetypes, uuid, pathlib
          apks = glob.glob("project/app/build/outputs/apk/debug/*.apk")
          if not apks:
              raise SystemExit("APK not found after successful build")
          apk = apks[0]
          token = os.environ["TG_BOT_TOKEN"]
          chat = os.environ["TG_CHAT_ID"]
          boundary = "----" + uuid.uuid4().hex
          body = bytearray()
          def w(s): body.extend(s.encode() if isinstance(s,str) else s)
          w(f"--{boundary}\r\n")
          w('Content-Disposition: form-data; name="chat_id"\r\n\r\n')
          w(f"{chat}\r\n")
          w(f"--{boundary}\r\n")
          w(f'Content-Disposition: form-data; name="document"; filename="{os.path.basename(apk)}"\r\n')
          w('Content-Type: application/vnd.android.package-archive\r\n\r\n')
          body.extend(pathlib.Path(apk).read_bytes())
          w(f"\r\n--{boundary}--\r\n")
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendDocument",
              data=bytes(body),
              headers={"Content-Type": f"multipart/form-data; boundary={boundary}"},
          )
          try:
              with urllib.request.urlopen(req, timeout=120) as resp:
                  print("Telegram OK:", resp.status)
          except Exception as e:
              print("Telegram send failed:", e)
              raise

      - name: Send error summary to Telegram
        if: steps.gradle.outcome == 'failure'
        shell: python
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          import os, pathlib, json, urllib.parse, urllib.request
          token = os.environ.get("TG_BOT_TOKEN","")
          chat = os.environ.get("TG_CHAT_ID","")
          if not token or not chat:
              print("Telegram secrets not set, skipping notify")
              raise SystemExit(0)
          try:
              summary = pathlib.Path("error_summary.txt").read_text(encoding="utf-8")
          except FileNotFoundError:
              summary = "Build failed (no summary captured)"
          text = "❌ *Build APK Gagal*\n\n```\n" + summary[:3500] + "\n```"
          data = urllib.parse.urlencode({
              "chat_id": chat,
              "text": text,
              "parse_mode": "Markdown",
              "disable_web_page_preview": "true",
          }).encode()
          req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=data)
          try:
              urllib.request.urlopen(req, timeout=60).read()
          except Exception as e:
              print("Telegram notify failed:", e)
              # jangan fail workflow hanya karena notif

      - name: Upload artifacts (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            gradle.log
            error_summary.txt
            payload.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Fail if gradle failed
        if: steps.gradle.outcome == 'failure'
        run: exit 1
