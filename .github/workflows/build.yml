name: Build Dynamic Android APK

on:
  repository_dispatch:
    types: [build_dynamic_apk]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Python Dependencies
        run: pip install pillow requests --quiet

      - name: Scaffold Project and Inject Code (Pure Python Runner)
        shell: python
        env:
          PAYLOAD_DATA: ${{ toJson(github.event.client_payload) }}
        run: |
          import os
          import json
          import base64
          import shutil
          import re
          import math
          import xml.etree.ElementTree as ET
          from PIL import Image, ImageDraw

          # 1. Buat folder struktur proyek
          os.makedirs("app/src/main/java/com/stb/dynamicapp", exist_ok=True)
          os.makedirs("app/src/main/res/layout", exist_ok=True)
          os.makedirs("app/src/main/res/drawable", exist_ok=True)
          os.makedirs("app/src/main/res/mipmap", exist_ok=True)

          if os.path.exists("app/src/main/res/values"):
              shutil.rmtree("app/src/main/res/values")

          # 2. Tulis file konfigurasi Gradle
          gradle_properties = (
              "android.useAndroidX=true\n"
              "android.enableJetifier=true\n"
              "android.nonTransitiveRClass=true\n"
              "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\n"
          )
          with open("gradle.properties", "w", encoding="utf-8") as f:
              f.write(gradle_properties)
          with open("app/gradle.properties", "w", encoding="utf-8") as f:
              f.write(gradle_properties)

          settings_gradle = (
              "pluginManagement {\n"
              "    repositories {\n"
              "        google()\n"
              "        mavenCentral()\n"
              "        gradlePluginPortal()\n"
              "    }\n"
              "}\n"
              "dependencyResolutionManagement {\n"
              "    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n"
              "    repositories {\n"
              "        google()\n"
              "        mavenCentral()\n"
              "    }\n"
              "}\n"
              "rootProject.name = 'DynamicAndroidApp'\n"
              "include ':app'\n"
          )
          with open("settings.gradle", "w", encoding="utf-8") as f:
              f.write(settings_gradle)

          with open("build.gradle", "w", encoding="utf-8") as f:
              f.write("plugins {\n    id 'com.android.application' version '8.2.2' apply false\n}\n")

          app_build_gradle = (
              "plugins {\n"
              "    id 'com.android.application'\n"
              "}\n\n"
              "android {\n"
              "    namespace 'com.stb.dynamicapp'\n"
              "    compileSdk 34\n\n"
              "    defaultConfig {\n"
              "        applicationId 'com.stb.dynamicapp'\n"
              "        minSdk 21\n"
              "        targetSdk 34\n"
              "        versionCode 1\n"
              "        versionName '1.0'\n"
              "    }\n\n"
              "    buildTypes {\n"
              "        release {\n"
              "            minifyEnabled false\n"
              "        }\n"
              "    }\n"
              "    compileOptions {\n"
              "        sourceCompatibility JavaVersion.VERSION_17\n"
              "        targetCompatibility JavaVersion.VERSION_17\n"
              "    }\n"
              "}\n\n"
              "dependencies {\n"
              "    implementation 'androidx.appcompat:appcompat:1.6.1'\n"
              "    implementation 'com.google.android.material:material:1.11.0'\n"
              "}\n"
          )
          with open("app/build.gradle", "w", encoding="utf-8") as f:
              f.write(app_build_gradle)

          # 3. Parse Payload dari Bot Telegram
          raw_payload = os.environ.get("PAYLOAD_DATA", "{}")
          data = json.loads(raw_payload)
          title = data.get("app_name", "DynamicApp").strip()
          clean_title = re.sub(r'[^a-zA-Z0-9 ]', '', title).strip()[:25] or "HomeGymTracker"

          # 4. Tulis AndroidManifest.xml (Bersih kolom 1 baris 1 & tema anti-crash)
          manifest_content = (
              '\n'
              '\n'
              '    \n'
              '        \n'
              '            \n'
              '                \n'
              '                \n'
              '            \n'
              '        \n'
              '    \n'
              '\n'
          )
          with open("app/src/main/AndroidManifest.xml", "w", encoding="utf-8") as f:
              f.write(manifest_content)

          # 5. Tulis MainActivity.java (Sanitasi string literal & auto-import)
          j_b64 = data.get("java_code_b64", "")
          j_code = base64.b64decode(j_b64).decode("utf-8", "ignore") if j_b64 else ""

          j_code = re.sub(r'"\s*\n\s*', '" + "', j_code)
          j_code = re.sub(r'\\(\s*\n)', r'\\n\1', j_code)

          auto_imports = (
              "package com.stb.dynamicapp;\n\n"
              "import android.app.Activity;\n"
              "import android.content.Context;\n"
              "import android.content.SharedPreferences;\n"
              "import android.graphics.Canvas;\n"
              "import android.graphics.Color;\n"
              "import android.graphics.Paint;\n"
              "import android.graphics.RectF;\n"
              "import android.os.Bundle;\n"
              "import android.view.View;\n"
              "import android.view.ViewGroup;\n"
              "import android.widget.*;\n"
              "import android.content.Intent;\n"
          )
          if "package com.stb.dynamicapp;" in j_code:
              j_code = j_code.replace("package com.stb.dynamicapp;", auto_imports.strip())
          else:
              j_code = auto_imports.strip() + "\n" + j_code

          j_code = re.sub(r'public\s+class\s+MainActivity\s+extends\s+[A-Za-z0-9_]+', 'public class MainActivity extends Activity', j_code)

          with open("app/src/main/java/com/stb/dynamicapp/MainActivity.java", "w", encoding="utf-8") as f:
              f.write(j_code)

          # 6. Tulis Layout XML (Validasi anti-kosong & auto-fix ID)
          robust_default_xml = (
              '\n'
              '\n'
              '    \n'
              '        \n'
              '        \n'
              '        \n'
              '        \n'
              '        \n'
              '        \n'
              '    \n'
              '\n'
          )

          x_b64 = data.get("xml_code_b64", "")
          x_code = base64.b64decode(x_b64).decode("utf-8", "ignore").strip() if x_b64 else ""

          if x_code.startswith("\ufeff"):
              x_code = x_code[1:]

          x_code = re.sub(r'&(?!(amp|lt|gt|quot|apos);)', '&', x_code)
          x_code = re.sub(r'android:id="(?!(?:@\+id/|@id/))([^"]+)"', r'android:id="@+id/\1"', x_code)

          is_valid = False
          if len(x_code) >= 50 and any(kw in x_code for kw in ["Layout", "ScrollView"]):
              try:
                  ET.fromstring(x_code)
                  is_valid = True
              except Exception:
                  is_valid = False

          final_xml = x_code if is_valid else robust_default_xml
          xml_path = "app/src/main/res/layout/activity_main.xml"
          with open(xml_path, "w", encoding="utf-8") as f:
              f.write(final_xml.strip() + "\n")

          # 7. Generate Ikon Tematik HD
          title_lower = title.lower()
          gym_keys = ["gym", "workout", "fitness", "dumbel", "dumbbell", "katrol", "pulley", "otot"]
          calc_keys = ["kalkulator", "hitung", "math", "kasir"]
          game_keys = ["game", "ketuk", "tap", "skor", "play", "main"]

          if any(k in title_lower for k in gym_keys):
              bg_color, inner_bg, icon_type = (216, 67, 21), (230, 81, 0), "gym"
          elif any(k in title_lower for k in calc_keys):
              bg_color, inner_bg, icon_type = (25, 118, 210), (33, 150, 243), "calc"
          elif any(k in title_lower for k in game_keys):
              bg_color, inner_bg, icon_type = (123, 31, 162), (156, 39, 176), "game"
          else:
              bg_color, inner_bg, icon_type = (48, 63, 159), (63, 81, 181), "star"

          img = Image.new("RGBA", (512, 512), (0, 0, 0, 0))
          draw = ImageDraw.Draw(img)
          draw.rounded_rectangle([24, 24, 488, 488], radius=115, fill=bg_color)
          draw.ellipse([64, 64, 448, 448], fill=inner_bg)
          white = (255, 255, 255, 255)

          if icon_type == "gym":
              draw.rounded_rectangle([190, 244, 322, 268], radius=8, fill=white)
              draw.rounded_rectangle([140, 180, 190, 332], radius=14, fill=white)
              draw.rounded_rectangle([110, 205, 140, 307], radius=10, fill=white)
              draw.rounded_rectangle([322, 180, 372, 332], radius=14, fill=white)
              draw.rounded_rectangle([372, 205, 402, 307], radius=10, fill=white)
          elif icon_type == "calc":
              draw.rounded_rectangle([130, 110, 382, 402], radius=28, fill=(255, 255, 255, 230))
              draw.rounded_rectangle([155, 135, 357, 195], radius=12, fill=bg_color)
              for y in [220, 280, 340]:
                  for x in [160, 230]:
                      draw.rounded_rectangle([x, y, x + 52, y + 42], radius=10, fill=inner_bg)
              draw.rounded_rectangle([300, 220, 352, 262], radius=10, fill=inner_bg)
              draw.rounded_rectangle([300, 280, 352, 382], radius=10, fill=(255, 87, 34, 255))
          elif icon_type == "game":
              draw.rounded_rectangle([100, 190, 412, 325], radius=60, fill=white)
              draw.ellipse([100, 250, 190, 380], fill=white)
              draw.ellipse([322, 250, 412, 380], fill=white)
              draw.rounded_rectangle([165, 220, 185, 290], radius=4, fill=bg_color)
              draw.rounded_rectangle([150, 235, 200, 275], radius=4, fill=bg_color)
          else:
              pts = []
              for i in range(10):
                  ang = i * math.pi / 5 - math.pi / 2
                  r = 145 if i % 2 == 0 else 70
                  pts.append((256 + r * math.cos(ang), 256 + r * math.sin(ang)))
              draw.polygon(pts, fill=white)
              draw.ellipse([230, 230, 282, 282], fill=bg_color)

          icon_final = img.resize((192, 192), Image.LANCZOS)
          icon_final.save("app/src/main/res/drawable/ic_launcher.png", "PNG")
          icon_final.save("app/src/main/res/mipmap/ic_launcher.png", "PNG")
          print("Setup file, XML, dan Ikon berhasil dibuat tanpa kendala.")

      - name: Setup Gradle Wrapper and Build APK
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true --stacktrace 2>&1 | tee build_output.log

      - name: Send APK to Telegram
        if: success()
        shell: python
        env:
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          APP_TITLE: ${{ github.event.client_payload.app_name }}
        run: |
          import os
          import glob
          import re
          import requests

          token = os.environ.get("BOT_TOKEN", "").strip()
          chat_id = os.environ.get("CHAT_ID", "").strip()
          title = os.environ.get("APP_TITLE", "Aplikasi").strip()

          if not token:
              print("ERROR: Secret TELEGRAM_TOKEN belum disetel!")
              exit(1)

          apk_files = glob.glob("app/build/outputs/apk/debug/*.apk")
          if not apk_files:
              print("ERROR: File APK tidak ditemukan di folder output!")
              exit(1)

          original_apk = apk_files[0]
          safe_name = re.sub(r'[^a-zA-Z0-9_-]', '_', title).strip('_') or "DynamicApp"
          new_file_name = f"{safe_name}.apk"
          new_apk_path = os.path.join(os.path.dirname(original_apk), new_file_name)

          if original_apk != new_apk_path:
              os.rename(original_apk, new_apk_path)

          url = f"https://api.telegram.org/bot{token}/sendDocument"
          payload = {
              "chat_id": chat_id,
              "caption": f"✅ *{title}* berhasil dikompilasi!\n📁 File: `{new_file_name}`\n🎨 Tema stabil & bebas force-close.",
              "parse_mode": "Markdown"
          }

          with open(new_apk_path, "rb") as f:
              files = {"document": (new_file_name, f, "application/vnd.android.package-archive")}
              r = requests.post(url, data=payload, files=files, timeout=90)

          if not r.json().get("ok"):
              print(f"Telegram menolak pengiriman file: {r.text}")
              exit(1)

          print(f"✅ APK {new_file_name} berhasil dikirim ke Telegram!")

      - name: Notify Failure to Telegram with Extracted Error
        if: failure()
        shell: python
        env:
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          import os
          import requests

          token = os.environ.get("BOT_TOKEN", "").strip()
          chat_id = os.environ.get("CHAT_ID", "").strip()

          if not token or not chat_id:
              exit(0)

          error_lines = []
          if os.path.exists("build_output.log"):
              with open("build_output.log", "r", encoding="utf-8", errors="ignore") as f:
                  lines = f.readlines()

              for idx, line in enumerate(lines):
                  line_lower = line.lower()
                  if "error:" in line_lower or "failed" in line_lower or "exception:" in line_lower:
                      start = max(0, idx - 1)
                      end = min(len(lines), idx + 4)
                      for l in lines[start:end]:
                          if l.strip() and l not in error_lines and "org.gradle." not in l:
                              error_lines.append(l.strip())

          error_snippet = "\n".join(error_lines[:15]) if error_lines else "Cek log tab GitHub Actions untuk detail."

          msg = f"❌ *Kompilasi APK Gagal!*\n\n*Detail Error:*\n```\n{error_snippet[:3500]}\n```"
          requests.post(f"https://api.telegram.org/bot{token}/sendMessage", data={
              "chat_id": chat_id,
              "text": msg,
              "parse_mode": "Markdown"
          })
