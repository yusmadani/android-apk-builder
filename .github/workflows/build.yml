name: Build APK from AI

on:
  repository_dispatch:
    types: [build_apk]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  GRADLE_VERSION: "8.7"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle ${{ env.GRADLE_VERSION }}
        run: |
          curl -sSL -f "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Set up Android SDK (cmdline-tools)
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          ( curl -sSL -f "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip \
            || curl -sSL -f "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip" -o /tmp/cmdline-tools.zip )
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install SDK platform & build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null

      # ---------------------------------------------------------------
      # Titik kritis: TIDAK memakai heredoc bash (cat << 'EOF') untuk
      # menyuntikkan kode Python. Step ini dijalankan langsung sebagai
      # file Python murni oleh runner (bukan lewat bash), jadi karakter
      # shell (<, >, |, &, backtick, kutip) di dalam script ini TIDAK
      # pernah ditafsirkan oleh shell sama sekali.
      # ---------------------------------------------------------------
      - name: Generate & Sanitize Android Project
        id: gen
        shell: python
        env:
          APP_NAME_B64: ${{ github.event.client_payload.app_name_b64 }}
          PACKAGE_NAME_RAW: ${{ github.event.client_payload.package_name }}
          ACTIVITY_XML_B64: ${{ github.event.client_payload.activity_main_xml_b64 }}
          MAIN_JAVA_B64: ${{ github.event.client_payload.main_activity_java_b64 }}
        run: |
          import base64
          import os
          import re
          import time
          from xml.sax.saxutils import escape as xml_escape
          import xml.dom.minidom as minidom


          def b64d(value):
              if not value:
                  return ""
              s = value.strip()
              s += "=" * ((-len(s)) % 4)
              try:
                  return base64.b64decode(s).decode("utf-8", errors="replace")
              except Exception:
                  return ""


          def sanitize_package_name(pkg, app_name):
              candidate = (pkg or "").strip()
              pattern = r'^[a-zA-Z_][a-zA-Z0-9_]*(\.[a-zA-Z_][a-zA-Z0-9_]*)+$'
              if re.match(pattern, candidate):
                  return candidate.lower()
              slug = re.sub(r'[^a-z0-9]', '', (app_name or "app").lower())
              if not slug:
                  slug = "app"
              if not slug[0].isalpha():
                  slug = "a" + slug
              return "com.aibuild.{}{}".format(slug[:20], int(time.time()) % 100000)


          def esc_text(text):
              return xml_escape(text or "App Android", {'"': "&quot;", "'": "&apos;"})


          FALLBACK_LAYOUT = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"\n'
              '    android:orientation="vertical"\n'
              '    android:layout_width="match_parent"\n'
              '    android:layout_height="match_parent"\n'
              '    android:gravity="center"\n'
              '    android:padding="24dp">\n\n'
              '    <TextView\n'
              '        android:id="@+id/tv_fallback"\n'
              '        android:layout_width="wrap_content"\n'
              '        android:layout_height="wrap_content"\n'
              '        android:textSize="16sp"\n'
              '        android:text="Layout tidak valid, memakai tampilan cadangan." />\n\n'
              '</LinearLayout>\n'
          )


          def escape_bare_ampersand(xml_str):
              return re.sub(r'&(?!amp;|lt;|gt;|quot;|apos;|#\d+;|#x[0-9a-fA-F]+;)', '&amp;', xml_str)


          def fix_missing_id_prefix(xml_str):
              def repl(match):
                  val = match.group(1)
                  if val.startswith('@+id/') or val.startswith('@id/') or val.startswith('@android:id/'):
                      return match.group(0)
                  clean = re.sub(r'[^A-Za-z0-9_]', '_', val)
                  return 'android:id="@+id/{}"'.format(clean)
              return re.sub(r'android:id\s*=\s*"([^"]*)"', repl, xml_str)


          def sanitize_layout_xml(raw_xml):
              if not raw_xml or not raw_xml.strip():
                  return FALLBACK_LAYOUT
              xml_str = raw_xml.strip().lstrip("\ufeff")
              if not xml_str.startswith("<?xml"):
                  xml_str = '<?xml version="1.0" encoding="utf-8"?>\n' + xml_str
              xml_str = escape_bare_ampersand(xml_str)
              xml_str = fix_missing_id_prefix(xml_str)
              if "xmlns:android=" not in xml_str:
                  xml_str = re.sub(
                      r'(<[A-Za-z][\w\.]*)',
                      r'\1 xmlns:android="http://schemas.android.com/apk/res/android"',
                      xml_str,
                      count=1,
                  )
              try:
                  minidom.parseString(xml_str.encode("utf-8"))
              except Exception:
                  return FALLBACK_LAYOUT
              return xml_str


          def compute_brace_depth(code):
              depth = 0
              in_string = False
              in_char = False
              in_line_comment = False
              in_block_comment = False
              escape = False
              i = 0
              n = len(code)
              while i < n:
                  c = code[i]
                  nxt = code[i + 1] if i + 1 < n else ""
                  if in_line_comment:
                      if c == "\n":
                          in_line_comment = False
                      i += 1
                      continue
                  if in_block_comment:
                      if c == "*" and nxt == "/":
                          i += 2
                          in_block_comment = False
                          continue
                      i += 1
                      continue
                  if in_string:
                      if escape:
                          escape = False
                      elif c == "\\":
                          escape = True
                      elif c == '"':
                          in_string = False
                      i += 1
                      continue
                  if in_char:
                      if escape:
                          escape = False
                      elif c == "\\":
                          escape = True
                      elif c == "'":
                          in_char = False
                      i += 1
                      continue
                  if c == "/" and nxt == "/":
                      in_line_comment = True
                      i += 1
                      continue
                  if c == "/" and nxt == "*":
                      in_block_comment = True
                      i += 1
                      continue
                  if c == '"':
                      in_string = True
                      i += 1
                      continue
                  if c == "'":
                      in_char = True
                      i += 1
                      continue
                  if c == "{":
                      depth += 1
                  elif c == "}":
                      depth -= 1
                  i += 1
              return depth


          def fix_broken_java_strings(code):
              out = []
              in_string = False
              in_char = False
              in_line_comment = False
              in_block_comment = False
              escape = False
              i = 0
              n = len(code)
              while i < n:
                  c = code[i]
                  nxt = code[i + 1] if i + 1 < n else ""
                  if in_line_comment:
                      out.append(c)
                      if c == "\n":
                          in_line_comment = False
                      i += 1
                      continue
                  if in_block_comment:
                      out.append(c)
                      if c == "*" and nxt == "/":
                          out.append(nxt)
                          i += 2
                          in_block_comment = False
                          continue
                      i += 1
                      continue
                  if in_string:
                      if escape:
                          out.append(c)
                          escape = False
                          i += 1
                          continue
                      if c == "\\":
                          out.append(c)
                          escape = True
                          i += 1
                          continue
                      if c == '"':
                          out.append(c)
                          in_string = False
                          i += 1
                          continue
                      if c == "\n":
                          out.append('\\n" +\n"')
                          i += 1
                          continue
                      out.append(c)
                      i += 1
                      continue
                  if in_char:
                      if escape:
                          out.append(c)
                          escape = False
                          i += 1
                          continue
                      if c == "\\":
                          out.append(c)
                          escape = True
                          i += 1
                          continue
                      if c == "'":
                          out.append(c)
                          in_char = False
                          i += 1
                          continue
                      out.append(c)
                      i += 1
                      continue
                  if c == "/" and nxt == "/":
                      in_line_comment = True
                      out.append(c)
                      i += 1
                      continue
                  if c == "/" and nxt == "*":
                      in_block_comment = True
                      out.append(c)
                      i += 1
                      continue
                  if c == '"':
                      in_string = True
                      out.append(c)
                      i += 1
                      continue
                  if c == "'":
                      in_char = True
                      out.append(c)
                      i += 1
                      continue
                  out.append(c)
                  i += 1
              if in_string:
                  out.append('"')
              return "".join(out)


          FALLBACK_JAVA_TEMPLATE = (
              "package {pkg};\n\n"
              "import android.app.Activity;\n"
              "import android.os.Bundle;\n\n"
              "public class MainActivity extends Activity {{\n"
              "    @Override\n"
              "    protected void onCreate(Bundle savedInstanceState) {{\n"
              "        super.onCreate(savedInstanceState);\n"
              "        setContentView(R.layout.activity_main);\n"
              "    }}\n"
              "}}\n"
          )


          def sanitize_java(raw_java, package_name):
              try:
                  code = raw_java or ""
                  code = code.replace("\r\n", "\n").replace("\r", "\n")
                  code = code.lstrip("\ufeff").strip()
                  if not code:
                      raise ValueError("empty java source")

                  if re.search(r'^\s*package\s+[\w.]+\s*;', code, re.MULTILINE):
                      code = re.sub(
                          r'^\s*package\s+[\w.]+\s*;',
                          "package {};".format(package_name),
                          code, count=1, flags=re.MULTILINE,
                      )
                  else:
                      code = "package {};\n\n".format(package_name) + code

                  code = re.sub(r'^\s*import\s+androidx\.[\w.]+;\s*$', '', code, flags=re.MULTILINE)
                  code = code.replace("AppCompatActivity", "Activity")

                  if not re.search(r'^\s*import\s+android\.app\.Activity\s*;', code, re.MULTILINE):
                      code = re.sub(r'(package\s+[\w.]+\s*;\s*\n)', r'\1import android.app.Activity;\n', code, count=1)
                  if not re.search(r'^\s*import\s+android\.os\.Bundle\s*;', code, re.MULTILINE):
                      code = re.sub(r'(package\s+[\w.]+\s*;\s*\n)', r'\1import android.os.Bundle;\n', code, count=1)

                  if not re.search(r'class\s+MainActivity\s+extends\s+\w+', code):
                      code = re.sub(r'class\s+MainActivity\b', 'class MainActivity extends Activity', code, count=1)

                  code = fix_broken_java_strings(code)

                  depth = compute_brace_depth(code)
                  if depth < 0:
                      raise ValueError("negative brace depth")
                  if depth > 0:
                      code = code.rstrip() + ("\n" + "}" * depth) + "\n"

                  if "class MainActivity" not in code:
                      raise ValueError("MainActivity missing after sanitation")

                  return code
              except Exception:
                  return FALLBACK_JAVA_TEMPLATE.format(pkg=package_name)


          def build_manifest(package_name):
              return (
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android"\n'
                  '    package="{pkg}">\n\n'
                  '    <application\n'
                  '        android:allowBackup="true"\n'
                  '        android:label="@string/app_name"\n'
                  '        android:icon="@android:drawable/sym_def_app_icon"\n'
                  '        android:theme="@android:style/Theme.DeviceDefault.NoActionBar"\n'
                  '        android:supportsRtl="true">\n\n'
                  '        <activity\n'
                  '            android:name=".MainActivity"\n'
                  '            android:exported="true">\n'
                  '            <intent-filter>\n'
                  '                <action android:name="android.intent.action.MAIN" />\n'
                  '                <category android:name="android.intent.category.LAUNCHER" />\n'
                  '            </intent-filter>\n'
                  '        </activity>\n\n'
                  '    </application>\n'
                  '</manifest>\n'
              ).format(pkg=package_name)


          def build_strings_xml(app_label_escaped):
              return (
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<resources>\n'
                  '    <string name="app_name">{}</string>\n'
                  '</resources>\n'
              ).format(app_label_escaped)


          ROOT_BUILD_GRADLE = (
              "plugins {\n"
              '    id("com.android.application") version "8.5.2" apply false\n'
              "}\n"
          )

          SETTINGS_GRADLE = (
              "pluginManagement {\n"
              "    repositories {\n"
              "        google()\n"
              "        mavenCentral()\n"
              "        gradlePluginPortal()\n"
              "    }\n"
              "}\n"
              "dependencyResolutionManagement {\n"
              "    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n"
              "    repositories {\n"
              "        google()\n"
              "        mavenCentral()\n"
              "    }\n"
              "}\n"
              'rootProject.name = "GeneratedApp"\n'
              'include(":app")\n'
          )

          GRADLE_PROPERTIES = (
              "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\n"
              "org.gradle.parallel=true\n"
              "android.useAndroidX=true\n"
              "android.enableJetifier=false\n"
          )


          def build_app_gradle(package_name):
              template = (
                  "plugins {{\n"
                  '    id("com.android.application")\n'
                  "}}\n\n"
                  "android {{\n"
                  "    namespace \"{pkg}\"\n"
                  "    compileSdk 34\n\n"
                  "    defaultConfig {{\n"
                  "        applicationId \"{pkg}\"\n"
                  "        minSdk 21\n"
                  "        targetSdk 34\n"
                  "        versionCode 1\n"
                  "        versionName \"1.0\"\n"
                  "    }}\n\n"
                  "    compileOptions {{\n"
                  "        sourceCompatibility JavaVersion.VERSION_17\n"
                  "        targetCompatibility JavaVersion.VERSION_17\n"
                  "    }}\n\n"
                  "    buildTypes {{\n"
                  "        debug {{\n"
                  "            minifyEnabled false\n"
                  "        }}\n"
                  "    }}\n"
                  "}}\n"
              )
              return template.format(pkg=package_name)


          def main():
              app_name = b64d(os.environ.get("APP_NAME_B64", "")).strip() or "AI App"
              package_name = sanitize_package_name(os.environ.get("PACKAGE_NAME_RAW", ""), app_name)
              raw_xml = b64d(os.environ.get("ACTIVITY_XML_B64", ""))
              raw_java = b64d(os.environ.get("MAIN_JAVA_B64", ""))

              layout_xml = sanitize_layout_xml(raw_xml)
              java_code = sanitize_java(raw_java, package_name)
              app_label = esc_text(app_name)

              project_root = os.path.join(os.getcwd(), "project")
              java_dir = os.path.join(project_root, "app", "src", "main", "java", *package_name.split("."))
              res_layout_dir = os.path.join(project_root, "app", "src", "main", "res", "layout")
              res_values_dir = os.path.join(project_root, "app", "src", "main", "res", "values")
              manifest_dir = os.path.join(project_root, "app", "src", "main")

              for d in (java_dir, res_layout_dir, res_values_dir, manifest_dir):
                  os.makedirs(d, exist_ok=True)

              def write(path, content):
                  with open(path, "w", encoding="utf-8", newline="\n") as f:
                      f.write(content)

              write(os.path.join(project_root, "settings.gradle"), SETTINGS_GRADLE)
              write(os.path.join(project_root, "build.gradle"), ROOT_BUILD_GRADLE)
              write(os.path.join(project_root, "gradle.properties"), GRADLE_PROPERTIES)

              android_home = os.environ.get("ANDROID_HOME", "")
              write(
                  os.path.join(project_root, "local.properties"),
                  "sdk.dir={}\n".format(android_home.replace("\\", "\\\\")),
              )

              write(os.path.join(project_root, "app", "build.gradle"), build_app_gradle(package_name))
              write(os.path.join(manifest_dir, "AndroidManifest.xml"), build_manifest(package_name))
              write(os.path.join(res_layout_dir, "activity_main.xml"), layout_xml)
              write(os.path.join(res_values_dir, "strings.xml"), build_strings_xml(app_label))
              write(os.path.join(java_dir, "MainActivity.java"), java_code)

              print("Project generated. package={} app_name={}".format(package_name, app_name))


          main()

      - name: Build Debug APK
        id: build
        run: |
          set +e
          cd project
          gradle --no-daemon --console=plain --stacktrace assembleDebug > "$GITHUB_WORKSPACE/build_log.txt" 2>&1
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Send APK to Telegram
        if: steps.build.outputs.exit_code == '0'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
        run: |
          APK_PATH=$(find project -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d chat_id="${CHAT_ID}" \
              -d text="Build selesai tanpa error tetapi file APK tidak ditemukan." > /dev/null
            exit 0
          fi
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F chat_id="${CHAT_ID}" \
            -F document=@"${APK_PATH}" \
            -F caption="Build APK berhasil" > /dev/null

      # ---------------------------------------------------------------
      # Sama seperti step generate: dijalankan sebagai file Python
      # murni, bukan lewat bash, sehingga isi log build (yang bisa
      # mengandung tanda kutip, backtick, dsb.) tidak pernah dirakit
      # jadi perintah shell yang rawan pecah.
      # ---------------------------------------------------------------
      - name: Extract & Send Error Log
        if: steps.build.outputs.exit_code != '0'
        shell: python
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
        run: |
          import os
          import re
          import urllib.request
          import urllib.parse

          BOT_TOKEN = os.environ.get("BOT_TOKEN", "")
          CHAT_ID = os.environ.get("CHAT_ID", "")

          try:
              with open("build_log.txt", "r", encoding="utf-8", errors="replace") as f:
                  log_text = f.read()
          except FileNotFoundError:
              log_text = "Build log tidak ditemukan (kemungkinan gagal sebelum tahap compile)."

          lines = log_text.splitlines()
          error_lines = [ln for ln in lines if re.search(r'error[: ]|FAILED|Exception', ln, re.IGNORECASE)]
          selected = error_lines[-40:] if error_lines else lines[-40:]
          summary = "\n".join(selected).strip() or "Tidak ada detail error yang bisa diringkas."

          if len(summary) > 3500:
              summary = summary[-3500:]

          message = "Build APK GAGAL.\n\nRingkasan error dari log Gradle:\n\n" + summary

          if BOT_TOKEN and CHAT_ID:
              url = "https://api.telegram.org/bot{}/sendMessage".format(BOT_TOKEN)
              data = urllib.parse.urlencode({"chat_id": CHAT_ID, "text": message}).encode("utf-8")
              req = urllib.request.Request(url, data=data, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      resp.read()
              except Exception as exc:
                  print("Gagal mengirim pesan Telegram:", exc)
          else:
              print("BOT_TOKEN atau CHAT_ID kosong, pesan tidak dikirim.")

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          if-no-files-found: ignore
