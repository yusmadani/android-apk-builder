name: Pro Expo APK Builder

on:
  repository_dispatch:
    types: [build_dynamic_apk]
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'ProApp'
      chat_id:
        description: 'Telegram Chat ID'
        required: true
        default: ''
      code_b64:
        description: 'Base64 Kode React Native'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Record Start Time
        run: echo "START_TIME=`date +%s`" >> $GITHUB_ENV

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Scaffold Professional Expo Framework
        run: |
          npx create-expo-app MobileApp --template blank
          cd MobileApp
          npm install react-native-paper lucide-react-native react-native-svg

      - name: Inject AI Code (App.js)
        run: |
          APP_NAME="${{ github.event.client_payload.app_name || github.event.inputs.app_name || 'ProApp' }}"
          CODE_B64="${{ github.event.client_payload.html_code_b64 || github.event.inputs.code_b64 || '' }}"
          python3 generate_project.py "\(APP_NAME" "\)CODE_B64"

      - name: Auto-Generate Android Native & Build Hermes APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd MobileApp
          npx expo prebuild --platform android --clean
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Laporan Telegram (Sukses / Gagal)
        if: always()
        env:
          CHAT_ID: ${{ github.event.client_payload.chat_id || github.event.inputs.chat_id }}
          BOT_TOKEN: "8531311195:AAEzEUdl4EkLCf57s2gFZB0lDYCQGZaXDDk"
          APP_NAME: ${{ github.event.client_payload.app_name || github.event.inputs.app_name || 'ProApp' }}
        run: |
          END_TIME=`date +%s`
          DURATION=`expr \(END_TIME -\)START_TIME`
          MINUTES=`expr $DURATION / 60`
          SECONDS=`expr $DURATION % 60`
          TIME_TEXT="\({MINUTES} menit\){SECONDS} detik"
          
          APK_PATH=`find MobileApp/android/app/build/outputs/apk/release -name "*.apk" | head -n 1`

          if [ -n "\(APK_PATH" ] && [ -f "\)APK_PATH" ]; then
            FILE_SIZE=`du -h "$APK_PATH" | cut -f1`
            CAPTION="✅ *Build SUKSES!*%0A%0A📱 *Aplikasi:* \({APP_NAME}%0A⏱ *Waktu Tunggu:*\){TIME_TEXT}\%0A📦 *Ukuran:* ${FILE_SIZE}%0A⚡ *Engine:* Expo Prebuild + Hermes"
            
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
              -F chat_id="${CHAT_ID}" \
              -F document=@"${APK_PATH}" \
              -F caption="${CAPTION}" \
              -F parse_mode="Markdown"
          else
            MESSAGE="❌ *Build GAGAL!*%0A%0A📱 *Aplikasi:* \({APP_NAME}\%0A⏱ *Waktu Terbuang:*\){TIME_TEXT}%0A⚠️ *Status:* Server gagal mengompilasi kode AI.%0A💡 *Solusi:* Kode AI mengandung syntax error. Silakan kirim ulang perintah '/bikin' di Telegram untuk mendapatkan kode baru dari AI."
            
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d chat_id="${CHAT_ID}" \
              -d text="${MESSAGE}" \
              -d parse_mode="Markdown"
            
            exit 1
          fi
