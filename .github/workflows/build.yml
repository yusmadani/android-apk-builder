name: Pro Expo APK Builder

on:
  repository_dispatch:
    types: [build_dynamic_apk]
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'ProApp'
      chat_id:
        description: 'Telegram Chat ID'
        required: true
        default: ''
      code_b64:
        description: 'Base64 Kode React Native'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Record Start Time
        run: python3 -c "import time, os; open(os.environ['GITHUB_ENV'], 'a').write(f'START_TIME={int(time.time())}\n')"

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Scaffold Professional Expo Framework
        env:
          CODE_B64: ${{ github.event.client_payload.code_b64 || github.event.inputs.code_b64 || '' }}
        run: |
          npx create-expo-app MobileApp --template blank
          cd MobileApp
          npm install react-native-paper lucide-react-native react-native-svg
          npx expo install @react-native-async-storage/async-storage
          
          # Cek cerdas & injeksi kamera menggunakan Python murni (Anti-error)
          python3 -c "
          import os, base64, json
          
          code_b64 = os.environ.get('CODE_B64', '')
          if not code_b64:
              print('Tidak ada kode yang dikirim, melewati cek kamera.')
              exit(0)
              
          try:
              decoded = base64.b64decode(code_b64).decode('utf-8')
              if 'expo-camera' in decoded:
                  print('🔍 Terdeteksi penggunaan expo-camera. Menginstal modul & perizinan...')
                  os.system('npx expo install expo-camera')
                  os.system('npm install expo-camera')
                  os.system('npx expo install expo-build-properties')
                  
                  # Sunting app.json dengan Python agar aman dari error sintaks
                  if os.path.exists('app.json'):
                      with open('app.json', 'r', encoding='utf-8') as f:
                          data = json.load(f)
                          
                      if 'expo' not in data:
                          data['expo'] = {}
                          
                      if 'plugins' not in data['expo']:
                          data['expo']['plugins'] = []
                          
                      # Cek apakah plugin expo-camera sudah ada
                      has_camera_plugin = False
                      for p in data['expo']['plugins']:
                          if isinstance(p, list) and len(p) > 0 and p[0] == 'expo-camera':
                              has_camera_plugin = True
                              break
                              
                      if not has_camera_plugin:
                          data['expo']['plugins'].append([
                              'expo-camera',
                              {'cameraPermission': 'Izinkan aplikasi ini memakai kamera.'}
                          ])
                          
                          with open('app.json', 'w', encoding='utf-8') as f:
                              json.dump(data, f, indent=2)
                          print('✅ Plugin expo-camera berhasil disuntikkan ke app.json')
              else:
                  print('Aplikasi ini tidak butuh kamera. Melewati instalasi kamera...')
          except Exception as e:
              print(f'⚠️ Terjadi kesalahan saat cek kamera: {e}')
          "
          
      - name: Inject AI Code, Package Name & Pro Vector Icon Generator
        env:
          APP_NAME: ${{ github.event.client_payload.app_name || github.event.inputs.app_name || 'ProApp' }}
          CODE_B64: ${{ github.event.client_payload.code_b64 || github.event.inputs.code_b64 || '' }}
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pil python3-requests fonts-dejavu-core
          
          python3 -c "
          import os, base64, json, re, requests
          from PIL import Image, ImageDraw

          code_b64 = os.environ.get('CODE_B64', '')
          raw_app_name = os.environ.get('APP_NAME', 'ProApp')
          
          app_name = raw_app_name.split('\n')[0].strip()
          if not app_name: app_name = 'ProApp'
          print(f'Menyuntikkan kode untuk aplikasi: {app_name}')

          if code_b64:
              decoded_code = base64.b64decode(code_b64).decode('utf-8')
              with open('MobileApp/App.js', 'w', encoding='utf-8') as f:
                  f.write(decoded_code)
              print('✅ Berhasil menyuntikkan kode AI ke MobileApp/App.js!')

          os.makedirs('MobileApp/assets', exist_ok=True)
          
          icon_downloaded = False
          try:
              app_name_lower = app_name.lower()
              icon_url = 'https://img.icons8.com/color/512/application-window.png' # Ikon Default
              
              # Logika Ikon Pintar
              if 'kasir' in app_name_lower or 'toko' in app_name_lower:
                  icon_url = 'https://img.icons8.com/color/512/shopping-cart.png'
              elif 'jadwal' in app_name_lower or 'kalender' in app_name_lower:
                  icon_url = 'https://img.icons8.com/color/512/calendar.png'
              elif 'keuangan' in app_name_lower or 'uang' in app_name_lower:
                  icon_url = 'https://img.icons8.com/color/512/money.png'
              elif 'scan' in app_name_lower or 'barcode' in app_name_lower:
                  icon_url = 'https://img.icons8.com/color/512/barcode-scanner.png'
              
              res = requests.get(icon_url, timeout=5)
              if res.status_code == 200:
                  with open('MobileApp/assets/icon_raw.png', 'wb') as handler:
                      handler.write(res.content)
                  
                  base_img = Image.open('MobileApp/assets/icon_raw.png').convert('RGBA')
                  base_img = base_img.resize((300, 300), Image.Resampling.LANCZOS)
                  
                  # Background putih agar gambar ikon terlihat jelas
                  bg = Image.new('RGBA', (512, 512), (255, 255, 255, 255))
                  bg.paste(base_img, (106, 106), base_img)
                  bg.convert('RGB').save('MobileApp/assets/icon.png')
                  bg.convert('RGB').save('MobileApp/assets/adaptive-icon.png')
                  icon_downloaded = True
                  print(f'✨ Berhasil merakit ikon khusus untuk: {app_name}')
          except Exception as e:
              print(f'⚠️ Gagal unduh ikon online: {e}')

          if not icon_downloaded:
              img = Image.new('RGB', (512, 512), color=(15, 39, 68))
              d = ImageDraw.Draw(img)
              d.rounded_rectangle([80, 80, 432, 432], radius=60, fill=(0, 212, 170), outline=(255, 255, 255), width=6)
              d.rectangle([80, 160, 432, 200], fill=(255, 255, 255))
              img.save('MobileApp/assets/icon.png')
              img.save('MobileApp/assets/adaptive-icon.png')
              print('🎨 Berhasil menghasilkan ikon geometris default!')

          slug_name = re.sub(r'[^a-zA-Z0-9]', '', app_name).lower()
          if not slug_name: slug_name = 'proapp'
          
          app_json_path = 'MobileApp/app.json'
          if os.path.exists(app_json_path):
              with open(app_json_path, 'r', encoding='utf-8') as f:
                  data = json.load(f)
              
              if 'expo' not in data:
                  data['expo'] = {}
              
              data['expo']['name'] = app_name
              data['expo']['slug'] = slug_name
              data['expo']['icon'] = './assets/icon.png'
              data['expo']['android'] = data['expo'].get('android', {})
              data['expo']['android']['package'] = f'com.yusmadani.{slug_name}'
              data['expo']['android']['adaptiveIcon'] = {
                  'foregroundImage': './assets/adaptive-icon.png',
                  'backgroundColor': '#FFFFFF'
              }
              
              with open(app_json_path, 'w', encoding='utf-8') as f:
                  json.dump(data, f, indent=2)
              print(f'✅ Konfigurasi app.json diperbarui untuk com.yusmadani.{slug_name}')
          "

      - name: Auto-Generate Android Native & Build Hermes APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          NODE_OPTIONS: "--max-old-space-size=4096"
          ORG_GRADLE_PROJECT_reactNativeArchitectures: "arm64-v8a"
        run: |
          cd MobileApp
          npx expo prebuild --platform android --clean
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK File
        env:
          APP_NAME: ${{ github.event.client_payload.app_name || github.event.inputs.app_name || 'ProApp' }}
        run: |
          cd MobileApp/android/app/build/outputs/apk/release/
          
          python3 -c "
          import os, re
          app_name = os.environ.get('APP_NAME', 'ProApp').strip()
          
          # Hapus spasi dan simbol, jadikan nama file yang bersih
          bersih = re.sub(r'[^a-zA-Z0-9]', '', app_name)
          if not bersih:
              bersih = 'Aplikasi'
              
          nama_file = f'{bersih}.apk'
          
          if os.path.exists('app-release.apk'):
              os.rename('app-release.apk', nama_file)
              print(f'✅ Sukses mengganti nama menjadi: {nama_file}')
          "
          
      - name: Laporan Telegram (Sukses / Gagal)
        if: always()
        env:
          CHAT_ID: ${{ github.event.client_payload.chat_id || github.event.inputs.chat_id }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          APP_NAME: ${{ github.event.client_payload.app_name || github.event.inputs.app_name || 'ProApp' }}
        run: |
          cat << 'EOF' > send_report.py
          import os, glob, time, sys, json, subprocess

          chat_id = os.environ.get("CHAT_ID")
          bot_token = os.environ.get("BOT_TOKEN")
          raw_app_name = os.environ.get("APP_NAME", "ProApp")
          app_name = raw_app_name.split('\n')[0].strip()[:35]

          start_time = os.environ.get("START_TIME", "")
          try:
              start_time = int(start_time)
          except Exception:
              start_time = int(time.time()) - 180
              
          duration = int(time.time()) - start_time
          mins, secs = divmod(duration, 60)
          time_text = f"{mins} menit {secs} detik"

          apks = glob.glob("MobileApp/android/app/build/outputs/apk/release/*.apk")
          if apks:
              apk = apks[0]
              size_mb = round(os.path.getsize(apk) / (1024*1024), 1)
              
              if size_mb > 49.5:
                  caption = f"✅ *Build SUKSES!*\n\n📱 *Aplikasi:* {app_name}\n⏱ *Waktu Tunggu:* {time_text}\n📦 *Ukuran:* {size_mb} MB\n⚡ *Engine:* Expo Prebuild + Hermes\n\n⚠️ _File melebihi 50MB. Sedang mengunggah ke Cloud..._"
                  os.system(f'curl -s -X POST "https://api.telegram.org/bot{bot_token}/sendMessage" -d chat_id="{chat_id}" -d text="{caption}" -d parse_mode="Markdown"')
                  
                  upload_cmd = f'curl -s -F "file=@{apk}" https://file.io'
                  try:
                      result = subprocess.check_output(upload_cmd, shell=True).decode('utf-8')
                      link = json.loads(result)['link']
                      msg = f"🚀 *APK Siap Diunduh!*\n📥 {link}"
                  except:
                      msg = "❌ Gagal mengunggah APK ke cloud."
                  os.system(f'curl -s -X POST "https://api.telegram.org/bot{bot_token}/sendMessage" -d chat_id="{chat_id}" -d text="{msg}" -d parse_mode="Markdown"')
              else:
                  caption = f"✅ *Build SUKSES!*\n\n📱 *Aplikasi:* {app_name}\n⏱ *Waktu Tunggu:* {time_text}\n📦 *Ukuran:* {size_mb} MB\n⚡ *Engine:* Expo Prebuild + Hermes"
                  cmd = f'curl -s -X POST "https://api.telegram.org/bot{bot_token}/sendDocument" -F chat_id="{chat_id}" -F document=@"{apk}" -F caption="{caption}" -F parse_mode="Markdown"'
                  os.system(cmd)
          else:
              msg = f"❌ *Build GAGAL!*\n\n📱 *Aplikasi:* {app_name}\n⏱ *Waktu Terbuang:* {time_text}"
              cmd = f'curl -s -X POST "https://api.telegram.org/bot{bot_token}/sendMessage" -d chat_id="{chat_id}" -d text="{msg}" -d parse_mode="Markdown"'
              os.system(cmd)
              sys.exit(1)
          EOF
          python3 send_report.py
