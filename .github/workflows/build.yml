name: Pro Expo APK Builder

on:
  repository_dispatch:
    types: [build_dynamic_apk]
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'ProApp'
      chat_id:
        description: 'Telegram Chat ID'
        required: true
        default: ''
      code_b64:
        description: 'Base64 Kode React Native'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Record Start Time
        run: python3 -c "import time, os; open(os.environ['GITHUB_ENV'], 'a').write(f'START_TIME={int(time.time())}\n')"

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Scaffold & Install Dependencies
        run: |
          npx create-expo-app MobileApp --template blank
          cd MobileApp
          npm install react-native-paper lucide-react-native react-native-svg
          npx expo install @react-native-async-storage/async-storage
          npx expo install expo-camera
          npx expo install react-native-webview
          npx expo install expo-build-properties
          npx expo install @react-navigation/native @react-navigation/native-stack

      - name: Inject AI Code & Assets
        env:
          APP_NAME: ${{ github.event.client_payload.app_name || github.event.inputs.app_name || 'ProApp' }}
          CODE_B64: ${{ github.event.client_payload.code_b64 || github.event.inputs.code_b64 || '' }}
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pil python3-requests
          
          python3 -c "
          import os, base64, json, re
          from PIL import Image
          
          code_b64 = os.environ.get('CODE_B64', '')
          raw_app_name = os.environ.get('APP_NAME', 'ProApp')
          app_name = raw_app_name.split('\n')[0].strip()
          if not app_name: app_name = 'ProApp'

          if code_b64:
              decoded_code = base64.b64decode(code_b64).decode('utf-8')
              with open('MobileApp/App.js', 'w', encoding='utf-8') as f:
                  f.write(decoded_code)
              print('✅ Kode AI berhasil disuntikkan!')

          os.makedirs('MobileApp/assets', exist_ok=True)
          
          # Buat ikon default yang aman
          img = Image.new('RGB', (512, 512), color=(15, 39, 68))
          img.save('MobileApp/assets/icon.png')
          img.save('MobileApp/assets/adaptive-icon.png')

          slug_name = re.sub(r'[^a-zA-Z0-9]', '', app_name).lower()
          if not slug_name: slug_name = 'proapp'
          
          app_json_path = 'MobileApp/app.json'
          if os.path.exists(app_json_path):
              with open(app_json_path, 'r', encoding='utf-8') as f:
                  data = json.load(f)
              if 'expo' not in data: data['expo'] = {}
              data['expo']['name'] = app_name
              data['expo']['slug'] = slug_name
              data['expo']['icon'] = './assets/icon.png'
              data['expo']['android'] = data['expo'].get('android', {})
              data['expo']['android']['package'] = f'com.yusmadani.{slug_name}'
              
              with open(app_json_path, 'w', encoding='utf-8') as f:
                  json.dump(data, f, indent=2)
          "

      - name: Build Hermes APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd MobileApp
          npx expo prebuild --platform android --clean
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename & Report APK
        if: always()
        env:
          CHAT_ID: ${{ github.event.client_payload.chat_id || github.event.inputs.chat_id }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          APP_NAME: ${{ github.event.client_payload.app_name || github.event.inputs.app_name || 'ProApp' }}
        run: |
          python3 -c "
          import os, glob, subprocess, re
          chat_id = os.environ.get('CHAT_ID')
          bot_token = os.environ.get('BOT_TOKEN')
          raw_name = os.environ.get('APP_NAME', 'ProApp').split('\n')[0].strip()
          file_name = re.sub(r'[^a-zA-Z0-9]', '', raw_name)
          if not file_name: file_name = 'Aplikasi'

          apks = glob.glob('MobileApp/android/app/build/outputs/apk/release/*.apk')
          if apks:
              apk = apks[0]
              new_apk_path = os.path.join(os.path.dirname(apk), f'{file_name}.apk')
              os.rename(apk, new_apk_path)
              
              size_mb = round(os.path.getsize(new_apk_path) / (1024*1024), 1)
              caption = f'✅ *Build SUKSES!*\n\n📱 *Aplikasi:* {raw_name}\n📦 *Ukuran:* {size_mb} MB'
              cmd = f'curl -s -X POST \"https://api.telegram.org/bot{bot_token}/sendDocument\" -F chat_id=\"{chat_id}\" -F document=@\"{new_apk_path}\" -F caption=\"{caption}\" -F parse_mode=\"Markdown\"'
              os.system(cmd)
          else:
              msg = f'❌ *Build GAGAL!*\n\n📱 *Aplikasi:* {raw_name}'
              cmd = f'curl -s -X POST \"https://api.telegram.org/bot{bot_token}/sendMessage\" -d chat_id=\"{chat_id}\" -d text=\"{msg}\" -d parse_mode=\"Markdown\"'
              os.system(cmd)
          "
