name: Build Dynamic Android APK

on:
  repository_dispatch:
    types: [build_dynamic_apk]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Scaffold Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/stb/dynamicapp
          mkdir -p app/src/main/res/layout

          # 1. gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF
          cp gradle.properties app/gradle.properties

          # 2. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DynamicAndroidApp"
          include ':app'
          EOF

          # 3. build.gradle (Root)
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.stb.dynamicapp'
              compileSdk 34

              defaultConfig {
                  applicationId "com.stb.dynamicapp"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # 5. AndroidManifest.xml
          echo "" | base64 -d > app/src/main/AndroidManifest.xml

      - name: Inject Dynamic App Code via Python
        env:
          PAYLOAD_DATA: ${{ toJson(github.event.client_payload) }}
        run: |
          python3 - << 'PYEOF'
          import os, json, base64, shutil

          if os.path.exists("app/src/main/res/values"):
              shutil.rmtree("app/src/main/res/values")

          raw = os.environ.get("PAYLOAD_DATA", "{}")
          data = json.loads(raw)

          j_b64 = data.get("java_code_b64", "")
          j_code = base64.b64decode(j_b64).decode("utf-8", "ignore")
          with open("app/src/main/java/com/stb/dynamicapp/MainActivity.java", "w", encoding="utf-8") as f:
              f.write(j_code)

          x_b64 = data.get("xml_code_b64", "")
          x_code = base64.b64decode(x_b64).decode("utf-8", "ignore").strip()
          if x_code.startswith("\ufeff"):
              x_code = x_code[1:]

          valid_tags = ["Layout", "View"]
          is_valid = any(t in x_code for t in valid_tags)

          if not x_code or not is_valid:
              fallback_b64 = ""
              x_code = base64.b64decode(fallback_b64).decode("utf-8")

          with open("app/src/main/res/layout/activity_main.xml", "w", encoding="utf-8") as f:
              f.write(x_code)

          print("Injeksi source code selesai!")
          PYEOF

      - name: Setup Gradle Wrapper and Build APK
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true --stacktrace

      - name: Send APK to Telegram via Python
        if: success()
        env:
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          APP_TITLE: ${{ github.event.client_payload.app_name }}
        run: |
          python3 - << 'PYEOF'
          import os, sys, glob, requests

          token = os.environ.get("BOT_TOKEN", "").strip()
          chat_id = os.environ.get("CHAT_ID", "").strip()
          title = os.environ.get("APP_TITLE", "Aplikasi").strip()

          if not token:
              print("ERROR: Secret TELEGRAM_TOKEN belum disetel di GitHub!")
              sys.exit(1)

          # Cari file APK secara rekursif dengan absolute path
          apk_files = glob.glob(os.path.abspath("app/build/outputs/apk/debug/*.apk"))
          if not apk_files:
              print("ERROR: File APK tidak ditemukan di app/build/outputs/apk/debug/")
              sys.exit(1)

          apk_path = apk_files[0]
          file_size = os.path.getsize(apk_path)
          print(f"Mengirim file APK: {apk_path} ({file_size} bytes)")
          print(f"Tujuan Chat ID: {chat_id}")

          url = f"https://api.telegram.org/bot{token}/sendDocument"
          data = {
              "chat_id": chat_id,
              "caption": f"✅ APK Berhasil Dikompilasi: {title}"
          }

          with open(apk_path, "rb") as doc:
              files = {"document": (os.path.basename(apk_path), doc, "application/vnd.android.package-archive")}
              resp = requests.post(url, data=data, files=files, timeout=120)

          print("Respon HTTP:", resp.status_code)
          print("Isi Respon:", resp.text)

          res_json = resp.json()
          if not res_json.get("ok"):
              print("Gagal mengirim file ke Telegram!")
              sys.exit(1)

          print("✅ APK berhasil dikirim langsung ke Telegram!")
          PYEOF

      - name: Notify Failure to Telegram
        if: failure()
        env:
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          if [ -n "$BOT_TOKEN" ]; then
            curl -s -X POST "https://api.telegram.org/bot\({BOT_TOKEN}/sendMessage" -d "chat_id=\){CHAT_ID}" -d "text=❌ Gagal mengompilasi APK. Cek detail error di log GitHub Actions."
          fi
