name: Build Dynamic Android APK

on:
repository_dispatch:
types: [build_dynamic_apk]

jobs:
build:
runs-on: ubuntu-latest

```
steps:

  # ============================================================
  # 1. CHECKOUT
  # ============================================================
  - name: Checkout Repository
    uses: actions/checkout@v4


  # ============================================================
  # 2. JAVA 17
  # ============================================================
  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: 'temurin'
      java-version: '17'


  # ============================================================
  # 3. ANDROID SDK
  # ============================================================
  - name: Setup Android SDK
    uses: android-actions/setup-android@v3


  # ============================================================
  # 4. SCAFFOLD ANDROID PROJECT
  # ============================================================
  - name: Scaffold Android Project Structure
    shell: bash
    run: |
      set -e

      mkdir -p app/src/main/java/com/stb/dynamicapp
      mkdir -p app/src/main/res/layout
      mkdir -p app/src/main/res/values

      # --------------------------------------------------------
      # gradle.properties
      # --------------------------------------------------------
      cat << 'EOF' > gradle.properties
      android.useAndroidX=true
      android.enableJetifier=true
      android.nonTransitiveRClass=true
      org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
      EOF

      # --------------------------------------------------------
      # settings.gradle
      # --------------------------------------------------------
      cat << 'EOF' > settings.gradle
      pluginManagement {
          repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
          }
      }

      dependencyResolutionManagement {
          repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

          repositories {
              google()
              mavenCentral()
          }
      }

      rootProject.name = "DynamicAndroidApp"

      include ':app'
      EOF

      # --------------------------------------------------------
      # Root build.gradle
      # --------------------------------------------------------
      cat << 'EOF' > build.gradle
      plugins {
          id 'com.android.application' version '8.2.2' apply false
      }
      EOF

      # --------------------------------------------------------
      # app/build.gradle
      # --------------------------------------------------------
      cat << 'EOF' > app/build.gradle
      plugins {
          id 'com.android.application'
      }

      android {
          namespace 'com.stb.dynamicapp'
          compileSdk 34

          defaultConfig {
              applicationId "com.stb.dynamicapp"
              minSdk 21
              targetSdk 34
              versionCode 1
              versionName "1.0"
          }

          buildTypes {
              release {
                  minifyEnabled false
              }

              debug {
                  minifyEnabled false
              }
          }

          compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
          }
      }

      dependencies {
          implementation 'androidx.appcompat:appcompat:1.6.1'
          implementation 'com.google.android.material:material:1.11.0'
      }
      EOF

      # --------------------------------------------------------
      # AndroidManifest.xml
      # --------------------------------------------------------
      echo "" | base64 -d > app/src/main/AndroidManifest.xml


  # ============================================================
  # 5. INJECT DYNAMIC JAVA + XML
  # ============================================================
  - name: Inject Dynamic App Code via Python
    env:
      PAYLOAD_DATA: ${{ toJson(github.event.client_payload) }}

    run: |
      set -e

      python3 - << 'PYEOF'
      import os
      import json
      import base64
      import shutil

      # Hapus values dari project lama
      # agar resource lama tidak bentrok.
      values_dir = "app/src/main/res/values"

      if os.path.exists(values_dir):
          shutil.rmtree(values_dir)

      os.makedirs(values_dir, exist_ok=True)

      raw = os.environ.get("PAYLOAD_DATA", "{}")

      try:
          data = json.loads(raw)
      except Exception as e:
          raise RuntimeError(
              f"PAYLOAD_DATA bukan JSON valid: {e}"
          )

      # ========================================================
      # JAVA
      # ========================================================

      j_b64 = data.get("java_code_b64", "")

      if not j_b64:
          raise RuntimeError(
              "java_code_b64 tidak ditemukan."
          )

      try:
          j_code = base64.b64decode(
              j_b64
          ).decode(
              "utf-8",
              "ignore"
          ).strip()
      except Exception as e:
          raise RuntimeError(
              f"Gagal decode Java: {e}"
          )

      if not j_code:
          raise RuntimeError(
              "Java code kosong."
          )

      with open(
          "app/src/main/java/com/stb/dynamicapp/MainActivity.java",
          "w",
          encoding="utf-8"
      ) as f:
          f.write(j_code)

      # ========================================================
      # XML
      # ========================================================

      x_b64 = data.get("xml_code_b64", "")

      if x_b64:
          try:
              x_code = base64.b64decode(
                  x_b64
              ).decode(
                  "utf-8",
                  "ignore"
              ).strip()
          except Exception as e:
              raise RuntimeError(
                  f"Gagal decode XML: {e}"
              )
      else:
          x_code = ""

      # Hilangkan UTF-8 BOM
      if x_code.startswith("\ufeff"):
          x_code = x_code[1:]

      # ========================================================
      # VALIDASI XML SEDERHANA
      # ========================================================

      valid_tags = [
          "<LinearLayout",
          "<RelativeLayout",
          "<FrameLayout",
          "<ConstraintLayout",
          "<ScrollView",
          "<androidx.",
          "<View"
      ]

      is_valid = any(
          tag in x_code
          for tag in valid_tags
      )

      # ========================================================
      # FALLBACK XML
      # ========================================================

      if not x_code or not is_valid:

          fallback_b64 = (
              "PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4K"
              "PExpbmVhckxheW91dCB4bWxuczphbmRyb2lkPSJodHRwOi8vc2No"
              "ZW1hcy5hbmRyb2lkLmNvbS9hcGsvcmVzL2FuZHJvaWQiCiAgICBh"
              "bmRyb2lkOmxheW91dF93aWR0aD0ibWF0Y2hfcGFyZW50IgogICAg"
              "YW5kcm9pZDpsYXlvdXRfaGVpZ2h0PSJtYXRjaF9wYXJlbnQiCiAg"
              "ICBhbmRyb2lkOmdyYXZpdHk9ImNlbnRlciIKICAgIGFuZHJvaWQ6"
              "b3JpZW50YXRpb249InZlcnRpY2FsIj4KICAgIDxUZXh0Vmlldwog"
              "ICAgICAgIGFuZHJvaWQ6bGF5b3V0X3dpZHRoPSJ3cmFwX2NvbnRl"
              "bnQiCiAgICAgICAgYW5kcm9pZDpsYXlvdXRfaGVpZ2h0PSJ3cmFw"
              "X2NvbnRlbnQiCiAgICAgICAgYW5kcm9pZDp0ZXh0PSJBcGxpa2Fz"
              "aSBTaWFwIgogICAgICAgIGFuZHJvaWQ6dGV4dFNpemU9IjIwc3Ai"
              "IC8+CjwvTGluZWFyTGF5b3V0Pgo="
          )

          x_code = base64.b64decode(
              fallback_b64
          ).decode(
              "utf-8"
          )

          print(
              "WARNING: XML dari payload tidak valid."
          )
          print(
              "Menggunakan fallback layout."
          )

      with open(
          "app/src/main/res/layout/activity_main.xml",
          "w",
          encoding="utf-8"
      ) as f:
          f.write(x_code)

      print("======================================")
      print("Dynamic source injection berhasil")
      print("Java : OK")
      print("XML  : OK")
      print("======================================")

      PYEOF


  # ============================================================
  # 6. DEBUG INFORMASI PAYLOAD
  # ============================================================
  - name: Verify Payload
    env:
      CHAT_ID: ${{ github.event.client_payload.chat_id }}
      APP_TITLE: ${{ github.event.client_payload.app_name }}

    run: |
      echo "App Title : $APP_TITLE"
      echo "Chat ID   : $CHAT_ID"

      if [ -z "$CHAT_ID" ]; then
        echo "ERROR: chat_id kosong."
        exit 1
      fi


  # ============================================================
  # 7. SETUP GRADLE + BUILD
  # ============================================================
  - name: Setup Gradle Wrapper and Build APK
    run: |
      set -e

      gradle wrapper --gradle-version 8.5

      chmod +x gradlew

      ./gradlew assembleDebug \
        -Pandroid.useAndroidX=true \
        -Pandroid.enableJetifier=true \
        --stacktrace \
        --no-daemon


  # ============================================================
  # 8. FIND APK
  # ============================================================
  - name: Locate APK
    id: apk
    run: |
      set -e

      APK_PATH=$(find \
        app/build/outputs/apk/debug \
        -type f \
        -name "*.apk" \
        | head -n 1)

      if [ -z "$APK_PATH" ]; then
        echo "ERROR: APK tidak ditemukan."
        exit 1
      fi

      echo "APK ditemukan:"
      echo "$APK_PATH"

      echo "Ukuran APK:"
      ls -lh "$APK_PATH"

      echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"


  # ============================================================
  # 9. SEND APK TO TELEGRAM
  # ============================================================
  - name: Send APK to Telegram
    if: success()

    env:
      CHAT_ID: ${{ github.event.client_payload.chat_id }}
      BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      APP_TITLE: ${{ github.event.client_payload.app_name }}

    run: |
      set -e

      APK_PATH="${{ steps.apk.outputs.apk_path }}"

      echo "======================================"
      echo "Telegram upload"
      echo "======================================"

      echo "Chat ID   : $CHAT_ID"
      echo "App Title : $APP_TITLE"
      echo "APK Path  : $APK_PATH"

      # --------------------------------------------------------
      # VALIDASI
      # --------------------------------------------------------

      if [ -z "$BOT_TOKEN" ]; then
        echo "ERROR: Secret TELEGRAM_TOKEN belum disetel."
        exit 1
      fi

      if [ -z "$CHAT_ID" ]; then
        echo "ERROR: chat_id kosong."
        exit 1
      fi

      if [ ! -f "$APK_PATH" ]; then
        echo "ERROR: File APK tidak ditemukan."
        exit 1
      fi

      # --------------------------------------------------------
      # UKURAN FILE
      # --------------------------------------------------------

      APK_SIZE=$(stat -c%s "$APK_PATH")

      echo "APK size: $APK_SIZE bytes"

      # Telegram Bot API saat ini membatasi upload
      # sendDocument melalui multipart/form-data pada 50 MB.
      if [ "$APK_SIZE" -gt 52428800 ]; then
        echo "ERROR: APK lebih besar dari 50 MB."
        exit 1
      fi

      # --------------------------------------------------------
      # KIRIM KE TELEGRAM
      # --------------------------------------------------------

      TELEGRAM_URL="https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"

      echo "Mengirim APK ke Telegram..."

      HTTP_CODE=$(curl \
        -sS \
        -o tg_result.json \
        -w "%{http_code}" \
        -X POST \
        "$TELEGRAM_URL" \
        -F "chat_id=${CHAT_ID}" \
        -F "document=@${APK_PATH}" \
        -F "caption=✅ APK Berhasil Dikompilasi: ${APP_TITLE}")

      echo ""
      echo "HTTP Status: $HTTP_CODE"

      echo ""
      echo "Respons Telegram:"
      cat tg_result.json
      echo ""

      # --------------------------------------------------------
      # CEK RESPONSE
      # --------------------------------------------------------

      if ! grep -q '"ok":true' tg_result.json; then
        echo "ERROR: Telegram menolak upload APK."
        exit 1
      fi

      echo "======================================"
      echo "APK BERHASIL DIKIRIM KE TELEGRAM"
      echo "======================================"


  # ============================================================
  # 10. NOTIFY FAILURE
  # ============================================================
  - name: Notify Failure to Telegram
    if: ${{ failure() }}

    env:
      CHAT_ID: ${{ github.event.client_payload.chat_id }}
      BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

    run: |

      if [ -z "$BOT_TOKEN" ]; then
        echo "TELEGRAM_TOKEN tidak tersedia."
        exit 0
      fi

      if [ -z "$CHAT_ID" ]; then
        echo "chat_id tidak tersedia."
        exit 0
      fi

      TELEGRAM_URL="https://api.telegram.org/bot${BOT_TOKEN}/sendMessage"

      curl \
        -sS \
        -X POST \
        "$TELEGRAM_URL" \
        -d "chat_id=${CHAT_ID}" \
        --data-urlencode \
        "text=❌ Gagal mengompilasi APK. Silakan cek log GitHub Actions."

      echo ""
      echo "Notifikasi kegagalan dikirim ke Telegram."
```
