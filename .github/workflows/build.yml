name: React Native Hermes APK Builder

on:
  repository_dispatch:
    types: [build_dynamic_apk]
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'ProApp'
      chat_id:
        description: 'Telegram Chat ID'
        required: true
        default: ''
      code_b64:
        description: 'Base64 Kode React Native'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Generate React Native + Hermes Workspace
        run: |
          APP_NAME="${{ github.event.client_payload.app_name || github.event.inputs.app_name || 'ProApp' }}"
          CODE_B64="${{ github.event.client_payload.html_code_b64 || github.event.inputs.code_b64 || '' }}"
          python3 generate_project.py "\(APP_NAME" "\)CODE_B64"

      - name: Cache Node Modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: \({{ runner.os }}-node-modules-\){{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install React Native Dependencies
        run: |
          npm install --save-dev @babel/core@^7.20.0 @babel/plugin-transform-react-jsx@^7.23.4 metro-react-native-babel-preset@^0.77.0 @react-native/babel-preset@0.73.21 --legacy-peer-deps
          npm install --legacy-peer-deps

      - name: Compile JS to Hermes Bytecode & Bundle
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --reset-cache \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res \
            --verbose

      - name: Build Standalone Hermes APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          # Mengunci ke Gradle 8.3 sesuai spesifikasi wajib React Native 0.73
          gradle wrapper --gradle-version 8.3
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Kirim APK ke Telegram
        run: |
          CHAT_ID="${{ github.event.client_payload.chat_id || github.event.inputs.chat_id }}"
          BOT_TOKEN="8531311195:AAEzEUdl4EkLCf57s2gFZB0lDYCQG ঐতিহ্যEkLCf57s2gFZB0lDYCQGZaXDDk"
          APP_NAME="${{ github.event.client_payload.app_name || github.event.inputs.app_name || 'ProApp' }}"

          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)

          if [ -n "\(APK_PATH" ] && [ -f "\)APK_PATH" ]; then
            FILE_SIZE=\((du -h "\)APK_PATH" | cut -f1)
            CAPTION="🚀 *React Native Hermes APK Selesai!*%0A%0A📱 *Aplikasi:* \({APP_NAME}%0A⚡ *Engine:* Meta Hermes AOT Bytecode%0A📦 *Ukuran:*\){FILE_SIZE}%0A💎 *Arsitektur:* 100% Native View & GPU Rendered"
            
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
              -F chat_id="${CHAT_ID}" \
              -F document=@"${APK_PATH}" \
              -F caption="${CAPTION}" \
              -F parse_mode="Markdown"
          else
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d chat_id="${CHAT_ID}" \
              -d text="❌ Gagal menemukan file APK hasil kompilasi."
            exit 1
          fi
