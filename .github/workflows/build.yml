name: Build Dynamic Android APK

"on":
repository_dispatch:
types:
- build_dynamic_apk

jobs:
build:
runs-on: ubuntu-latest

```
steps:

  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Scaffold Android Project
    shell: bash
    run: |
      set -e

      mkdir -p app/src/main/java/com/stb/dynamicapp
      mkdir -p app/src/main/res/layout
      mkdir -p app/src/main/res/values

      cat > gradle.properties <<'EOF'
      android.useAndroidX=true
      android.enableJetifier=true
      android.nonTransitiveRClass=true
      org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
      EOF

      cat > settings.gradle <<'EOF'
      pluginManagement {
          repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
          }
      }

      dependencyResolutionManagement {
          repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

          repositories {
              google()
              mavenCentral()
          }
      }

      rootProject.name = "DynamicAndroidApp"

      include ':app'
      EOF

      cat > build.gradle <<'EOF'
      plugins {
          id 'com.android.application' version '8.2.2' apply false
      }
      EOF

      cat > app/build.gradle <<'EOF'
      plugins {
          id 'com.android.application'
      }

      android {
          namespace 'com.stb.dynamicapp'
          compileSdk 34

          defaultConfig {
              applicationId "com.stb.dynamicapp"
              minSdk 21
              targetSdk 34
              versionCode 1
              versionName "1.0"
          }

          buildTypes {
              debug {
                  minifyEnabled false
              }

              release {
                  minifyEnabled false
              }
          }

          compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
          }
      }

      dependencies {
          implementation 'androidx.appcompat:appcompat:1.6.1'
          implementation 'com.google.android.material:material:1.11.0'
      }
      EOF

      cat > app/src/main/AndroidManifest.xml <<'EOF'
      <?xml version="1.0" encoding="utf-8"?>

      <manifest
          xmlns:android="http://schemas.android.com/apk/res/android">

          <application
              android:allowBackup="true"
              android:label="@string/app_name"
              android:supportsRtl="true"
              android:theme="@style/Theme.DynamicAndroidApp">

              <activity
                  android:name=".MainActivity"
                  android:exported="true">

                  <intent-filter>

                      <action
                          android:name="android.intent.action.MAIN" />

                      <category
                          android:name="android.intent.category.LAUNCHER" />

                  </intent-filter>

              </activity>

          </application>

      </manifest>
      EOF

      cat > app/src/main/res/values/strings.xml <<'EOF'
      <?xml version="1.0" encoding="utf-8"?>

      <resources>

          <string name="app_name">Dynamic Android App</string>

      </resources>
      EOF

      cat > app/src/main/res/values/themes.xml <<'EOF'
      <?xml version="1.0" encoding="utf-8"?>

      <resources>

          <style
              name="Theme.DynamicAndroidApp"
              parent="Theme.MaterialComponents.DayNight.NoActionBar" />

      </resources>
      EOF


  - name: Inject Dynamic App Code
    env:
      PAYLOAD_DATA: ${{ toJson(github.event.client_payload) }}

    shell: bash
    run: |
      set -e

      python3 <<'PYEOF'
      import os
      import json
      import base64

      data = json.loads(
          os.environ.get("PAYLOAD_DATA", "{}")
      )

      # ======================================================
      # JAVA
      # ======================================================

      java_b64 = data.get("java_code_b64", "")

      if not java_b64:
          raise SystemExit(
              "ERROR: java_code_b64 tidak ditemukan."
          )

      try:
          java_code = base64.b64decode(
              java_b64
          ).decode(
              "utf-8",
              "ignore"
          ).strip()
      except Exception as e:
          raise SystemExit(
              f"ERROR decode Java: {e}"
          )

      if not java_code:
          raise SystemExit(
              "ERROR: Java code kosong."
          )

      # ======================================================
      # XML
      # ======================================================

      xml_b64 = data.get("xml_code_b64", "")
      xml_code = ""

      if xml_b64:
          try:
              xml_code = base64.b64decode(
                  xml_b64
              ).decode(
                  "utf-8",
                  "ignore"
              ).strip()
          except Exception as e:
              raise SystemExit(
                  f"ERROR decode XML: {e}"
              )

      if xml_code.startswith("\ufeff"):
          xml_code = xml_code[1:]

      # ======================================================
      # FALLBACK XML
      # ======================================================

      if not xml_code:
          xml_code = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<LinearLayout '
              'xmlns:android="http://schemas.android.com/apk/res/android" '
              'android:layout_width="match_parent" '
              'android:layout_height="match_parent" '
              'android:gravity="center" '
              'android:orientation="vertical">\n'
              '    <TextView '
              'android:layout_width="wrap_content" '
              'android:layout_height="wrap_content" '
              'android:text="Aplikasi Siap" '
              'android:textSize="20sp" />\n'
              '</LinearLayout>\n'
          )

      # ======================================================
      # WRITE FILE
      # ======================================================

      with open(
          "app/src/main/java/com/stb/dynamicapp/MainActivity.java",
          "w",
          encoding="utf-8"
      ) as f:
          f.write(java_code)

      with open(
          "app/src/main/res/layout/activity_main.xml",
          "w",
          encoding="utf-8"
      ) as f:
          f.write(xml_code)

      print("====================================")
      print("Dynamic source injection berhasil")
      print("Java : OK")
      print("XML  : OK")
      print("====================================")

      PYEOF


  - name: Verify Payload
    env:
      CHAT_ID: ${{ github.event.client_payload.chat_id }}
      APP_TITLE: ${{ github.event.client_payload.app_name }}

    shell: bash
    run: |
      echo "===================================="
      echo "APP : $APP_TITLE"
      echo "CHAT: $CHAT_ID"
      echo "===================================="

      if [ -z "$CHAT_ID" ]; then
        echo "ERROR: chat_id kosong."
        exit 1
      fi


  - name: Build APK
    shell: bash
    run: |
      set -e

      gradle wrapper --gradle-version 8.5

      chmod +x gradlew

      ./gradlew assembleDebug \
        --stacktrace \
        --no-daemon \
        -Pandroid.useAndroidX=true \
        -Pandroid.enableJetifier=true


  - name: Find APK
    id: apk
    shell: bash
    run: |
      set -e

      APK_PATH="$(
        find app/build/outputs/apk/debug \
        -type f \
        -name "*.apk" \
        | head -n 1
      )"

      if [ -z "$APK_PATH" ]; then
        echo "ERROR: APK tidak ditemukan."
        exit 1
      fi

      echo "APK ditemukan:"
      echo "$APK_PATH"

      ls -lh "$APK_PATH"

      echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"


  - name: Send APK to Telegram
    if: success()

    env:
      CHAT_ID: ${{ github.event.client_payload.chat_id }}
      BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      APP_TITLE: ${{ github.event.client_payload.app_name }}

    shell: bash
    run: |
      set -e

      APK_PATH="${{ steps.apk.outputs.apk_path }}"

      echo "===================================="
      echo "KIRIM APK KE TELEGRAM"
      echo "===================================="

      if [ -z "$BOT_TOKEN" ]; then
        echo "ERROR: TELEGRAM_TOKEN belum disetel."
        exit 1
      fi

      if [ -z "$CHAT_ID" ]; then
        echo "ERROR: chat_id kosong."
        exit 1
      fi

      if [ ! -f "$APK_PATH" ]; then
        echo "ERROR: APK tidak ditemukan."
        exit 1
      fi

      echo "Chat ID : $CHAT_ID"
      echo "App     : $APP_TITLE"
      echo "APK     : $APK_PATH"
      echo ""

      RESPONSE="$(
        curl \
          -sS \
          -X POST \
          "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
          -F "chat_id=${CHAT_ID}" \
          -F "document=@${APK_PATH}" \
          -F "caption=✅ APK Berhasil Dikompilasi: ${APP_TITLE}"
      )"

      echo "===================================="
      echo "RESPONSE TELEGRAM"
      echo "===================================="

      echo "$RESPONSE"

      echo "$RESPONSE" | grep -q '"ok":true'

      echo ""
      echo "✅ APK berhasil dikirim ke Telegram."


  - name: Notify Failure to Telegram
    if: failure()

    env:
      CHAT_ID: ${{ github.event.client_payload.chat_id }}
      BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

    shell: bash
    run: |
      if [ -n "$BOT_TOKEN" ] && [ -n "$CHAT_ID" ]; then

        curl \
          -sS \
          -X POST \
          "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
          --data-urlencode "chat_id=${CHAT_ID}" \
          --data-urlencode \
          "text=❌ Gagal mengompilasi APK. Cek log GitHub Actions."

      fi
```
