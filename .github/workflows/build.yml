name: Build Dynamic Android APK

on:
  repository_dispatch:
    types: [build_dynamic_apk]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Inject Dynamic App Code via Python
        env:
          EVENT_JSON: ${{ toJson(github.event.client_payload) }}
        run: |
          python3 - << 'PYEOF'
          import os, json, base64, re

          data = json.loads(os.environ.get("EVENT_JSON", "{}"))

          # Pastikan direktori tujuan ada
          os.makedirs("app/src/main/java/com/stb/dynamicapp", exist_ok=True)
          os.makedirs("app/src/main/res/layout", exist_ok=True)
          os.makedirs("app/src/main/res/values", exist_ok=True)

          # 1. Tulis MainActivity.java
          java_b64 = data.get("java_code_b64", "")
          with open("app/src/main/java/com/stb/dynamicapp/MainActivity.java", "wb") as f:
              f.write(base64.b64decode(java_b64))

          # 2. Tulis activity_main.xml
          xml_b64 = data.get("xml_code_b64", "")
          with open("app/src/main/res/layout/activity_main.xml", "wb") as f:
              f.write(base64.b64decode(xml_b64))

          # 3. Tulis strings.xml bersih
          raw_name = data.get("app_name", "DynamicApp")
          clean_name = re.sub(r'[^a-zA-Z0-9 _-]', '', raw_name).strip() or "DynamicApp"
          strings_content = f'''
          
              {clean_name}
          
          '''
          with open("app/src/main/res/values/strings.xml", "w", encoding="utf-8") as f:
              f.write(strings_content.strip() + "\n")

          print("Semua file proyek berhasil diinjeksi tanpa error shell!")
          PYEOF

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Send APK to Telegram
        if: success()
        env:
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          APP_TITLE: ${{ github.event.client_payload.app_name }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)

          if [ -f "$APK_PATH" ]; then
            curl -F chat_id="$CHAT_ID" \
                 -F document=@"$APK_PATH" \
                 -F caption="✅ APK Berhasil Dikompilasi: $APP_TITLE" \
                 "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"
          fi

      - name: Notify Failure to Telegram
        if: failure()
        env:
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
               -d chat_id="$CHAT_ID" \
               -d text="❌ Gagal mengompilasi APK. Cek log GitHub Actions untuk melihat detail error."
