name: Build Dynamic Android APK

on:
  workflow_dispatch:
    inputs:
      test_app_name:
        description: 'Nama Aplikasi untuk Tes Manual'
        required: false
        default: 'GymTrackerTest'
  repository_dispatch:
    types: [build_dynamic_apk]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: pip install pillow requests --quiet

      # 1. Bersihkan sisa file lama agar tidak ada tumpang tindih
      - name: Clean Old Build Files
        run: rm -rf app project build_output.log payload.json

      # 2. Siapkan payload.json untuk generator
      - name: Create payload.json
        shell: python
        env:
          PAYLOAD_DATA: ${{ toJson(github.event.client_payload) }}
          MANUAL_APP_NAME: ${{ github.event.inputs.test_app_name }}
        run: |
          import os, json

          raw = os.environ.get("PAYLOAD_DATA", "")
          data = {}
          try:
              if raw and raw != "null":
                  data = json.loads(raw)
          except Exception:
              pass

          if not data:
              manual_name = os.environ.get("MANUAL_APP_NAME", "DynamicApp")
              data = {
                  "app_name": manual_name,
                  "activity_main_xml": "",
                  "main_activity_java": ""
              }

          with open("payload.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

      # 3. Jalankan generator proyek Python murni
      - name: Run Project Generator
        run: python3 generate_project.py

      # 4. Validasi visual Manifest di log sebelum kompilasi
      - name: Verify AndroidManifest
        run: |
          echo "=== CEK 5 BARIS PERTAMA MANIFEST ==="
          head -n 5 app/src/main/AndroidManifest.xml
          echo "====================================="

      # 5. Kompilasi APK dengan Gradle
      - name: Build APK with Gradle
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true --stacktrace 2>&1 | tee build_output.log

      # 6. Kirim APK ke Telegram
      - name: Send APK to Telegram
        if: success()
        shell: python
        env:
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          APP_TITLE: ${{ github.event.client_payload.app_name || github.event.inputs.test_app_name }}
        run: |
          import os, glob, re, requests

          token = os.environ.get("BOT_TOKEN", "").strip()
          chat_id = os.environ.get("CHAT_ID", "").strip()
          title = os.environ.get("APP_TITLE", "Aplikasi").strip() or "Aplikasi"

          if not token or not chat_id:
              print("Pengiriman Telegram dilewati (pengujian manual web / token kosong).")
              exit(0)

          apk_files = glob.glob("app/build/outputs/apk/debug/*.apk")
          if not apk_files:
              print("ERROR: File APK tidak ditemukan di folder app/build/outputs/apk/debug/!")
              exit(1)

          original_apk = apk_files[0]
          safe_name = re.sub(r'[^a-zA-Z0-9_-]', '_', title).strip('_') or "DynamicApp"
          new_file_name = f"{safe_name}.apk"
          new_apk_path = os.path.join(os.path.dirname(original_apk), new_file_name)

          if original_apk != new_apk_path:
              os.rename(original_apk, new_apk_path)

          url = f"https://api.telegram.org/bot{token}/sendDocument"
          payload = {
              "chat_id": chat_id,
              "caption": f"✅ *{title}* berhasil dikompilasi!\n📁 File: `{new_file_name}`\n🎨 Versi stabil bebas force-close.",
              "parse_mode": "Markdown"
          }

          with open(new_apk_path, "rb") as f:
              files = {"document": (new_file_name, f, "application/vnd.android.package-archive")}
              r = requests.post(url, data=payload, files=files, timeout=90)

          if not r.json().get("ok"):
              print(f"Gagal mengirim ke Telegram: {r.text}")
              exit(1)

          print(f"✅ APK {new_file_name} berhasil dikirim ke Telegram!")

      # 7. Kirim log error ke Telegram jika kompilasi gagal
      - name: Notify Failure to Telegram
        if: failure()
        shell: python
        env:
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          import os, requests

          token = os.environ.get("BOT_TOKEN", "").strip()
          chat_id = os.environ.get("CHAT_ID", "").strip()

          if not token or not chat_id:
              exit(0)

          error_lines = []
          if os.path.exists("build_output.log"):
              with open("build_output.log", "r", encoding="utf-8", errors="ignore") as f:
                  lines = f.readlines()

              for idx, line in enumerate(lines):
                  line_lower = line.lower()
                  if "error:" in line_lower or "failed" in line_lower or "exception:" in line_lower:
                      start = max(0, idx - 1)
                      end = min(len(lines), idx + 4)
                      for l in lines[start:end]:
                          if l.strip() and l not in error_lines and "org.gradle." not in l:
                              error_lines.append(l.strip())

          error_snippet = "\n".join(error_lines[:15]) if error_lines else "Cek tab GitHub Actions untuk detail error."
          msg = f"❌ *Kompilasi APK Gagal!*\n\n*Detail Error:*\n```\n{error_snippet[:3500]}\n```"
          requests.post(f"https://api.telegram.org/bot{token}/sendMessage", data={
              "chat_id": chat_id,
              "text": msg,
              "parse_mode": "Markdown"
          })
