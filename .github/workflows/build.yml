name: Build Dynamic Android APK

on:
  repository_dispatch:
    types: [build_dynamic_apk]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Inject Dynamic App Code
        run: |
          mkdir -p app/src/main/java/com/stb/dynamicapp
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # Dekode file kode Java
          echo "${{ github.event.client_payload.java_code_b64 }}" | base64 -d > app/src/main/java/com/stb/dynamicapp/MainActivity.java

          # Dekode file layout XML
          echo "${{ github.event.client_payload.xml_code_b64 }}" | base64 -d > app/src/main/res/layout/activity_main.xml

          # Generate strings.xml yang valid dan bersih dari prolog error
          CLEAN_APP_NAME=\((echo "\){{ github.event.client_payload.app_name }}" | tr -cd 'a-zA-Z0-9 _-')
          cat < app/src/main/res/values/strings.xml
          
          
              $CLEAN_APP_NAME
          
          EOF

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Send APK to Telegram
        if: success()
        run: |
          CHAT_ID="${{ github.event.client_payload.chat_id }}"
          BOT_TOKEN="${{ secrets.TELEGRAM_TOKEN }}"
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)

          if [ -f "$APK_PATH" ]; then
            curl -F chat_id="$CHAT_ID" \
                 -F document=@"$APK_PATH" \
                 -F caption="✅ APK Berhasil Dikompilasi: ${{ github.event.client_payload.app_name }}" \
                 https://api.telegram.org/bot${BOT_TOKEN}/sendDocument
          fi

      - name: Notify Failure to Telegram
        if: failure()
        run: |
          CHAT_ID="${{ github.event.client_payload.chat_id }}"
          BOT_TOKEN="${{ secrets.TELEGRAM_TOKEN }}"
          curl -s -X POST https://api.telegram.org/bot${BOT_TOKEN}/sendMessage \
               -d chat_id="$CHAT_ID" \
               -d text="❌ Gagal mengompilasi APK. Terjadi error saat Gradle build."
