name: Compile Native Android APK

on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Generate Native Android Project
        env:
          APP_NAME: ${{ github.event.client_payload.app_name }}
        run: |
          mkdir -p app/src/main/java/com/stb/nativeapp app/src/main/res/layout app/src/main/res/values
          printf '%s\n' '' '' '    ' '        ' '            ' '                ' '                ' '            ' '        ' '    ' '' > app/src/main/AndroidManifest.xml
          SAFE_APP_NAME="${APP_NAME:-Kalkulator Diskon}"
          printf '%s\n' '' '' "    ${SAFE_APP_NAME}" '' > app/src/main/res/values/strings.xml
          printf '%s\n' '' '' '    ' '    ' '    ' '    ' '    ' '' > app/src/main/res/layout/activity_main.xml
          cat << 'EOF' > app/src/main/java/com/stb/nativeapp/MainActivity.java
          package com.stb.nativeapp;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.TextView;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  EditText etHarga = findViewById(R.id.etHarga);
                  EditText etDiskon = findViewById(R.id.etDiskon);
                  Button btnHitung = findViewById(R.id.btnHitung);
                  TextView tvHasil = findViewById(R.id.tvHasil);
                  btnHitung.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          String strHarga = etHarga.getText().toString();
                          String strDiskon = etDiskon.getText().toString();
                          if (!strHarga.isEmpty() && !strDiskon.isEmpty()) {
                              double harga = Double.parseDouble(strHarga);
                              double diskon = Double.parseDouble(strDiskon);
                              double potongan = harga * (diskon / 100);
                              double total = harga - potongan;
                              tvHasil.setText(String.format("Hemat: Rp %,.2f\nTotal Bayar: Rp %,.2f", potongan, total));
                          } else {
                              tvHasil.setText("Harap isi harga dan persentase diskon.");
                          }
                      }
                  });
              }
          }
          EOF
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath "com.android.tools.build:gradle:8.2.2" }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF
          echo "include ':app'" > settings.gradle
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'com.stb.nativeapp'
              compileSdk 34
              defaultConfig {
                  applicationId "com.stb.nativeapp"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF
      - name: Build Native APK
        run: |
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug --no-daemon
      - name: Send APK to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          APP_NAME: ${{ github.event.client_payload.app_name }}
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          curl -F chat_id="\(CHAT_ID" -F document=@"\)APK_PATH" -F caption="APK Native berhasil dibuat untuk: \({APP_NAME:-Kalkulator Diskon}!" "https://api.telegram.org/bot\){BOT_TOKEN}/sendDocument"
