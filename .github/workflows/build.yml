name: Build Dynamic Android APK

on:
  repository_dispatch:
    types: [build_dynamic_apk]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Scaffold Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/stb/dynamicapp
          mkdir -p app/src/main/res/layout

          # 1. gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF
          cp gradle.properties app/gradle.properties

          # 2. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DynamicAndroidApp"
          include ':app'
          EOF

          # 3. build.gradle (Root)
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.stb.dynamicapp'
              compileSdk 34

              defaultConfig {
                  applicationId "com.stb.dynamicapp"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # 5. Tulis AndroidManifest.xml standar (pasti terisi utuh)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          
          
              
                  
                      
                          
                          
                      
                  
              
          
          EOF

      - name: Inject Dynamic App Code via Python
        env:
          PAYLOAD_DATA: ${{ toJson(github.event.client_payload) }}
        run: |
          python3 - << 'PYEOF'
          import os, json, base64, shutil

          data = json.loads(os.environ.get("PAYLOAD_DATA", "{}"))

          # Hapus folder values agar tidak terjadi duplikasi resources
          if os.path.exists("app/src/main/res/values"):
              shutil.rmtree("app/src/main/res/values")

          # 1. Tulis Java Code
          java_code = base64.b64decode(data.get("java_code_b64", "")).decode("utf-8", errors="ignore").strip()
          with open("app/src/main/java/com/stb/dynamicapp/MainActivity.java", "w", encoding="utf-8") as f:
              f.write(java_code)

          # 2. Tulis Layout XML
          xml_code = base64.b64decode(data.get("xml_code_b64", "")).decode("utf-8", errors="ignore").strip()
          if xml_code.startswith("\ufeff"):
              xml_code = xml_code[1:]

          # Fallback layout jika output AI rusak atau kosong
          if not xml_code or "
          
              
          '''

          with open("app/src/main/res/layout/activity_main.xml", "w", encoding="utf-8") as f:
              f.write(xml_code)

          print("Injeksi Java & Layout XML berhasil.")
          PYEOF

      - name: Verify Manifest File Exists
        run: |
          ls -la app/src/main/AndroidManifest.xml
          cat app/src/main/AndroidManifest.xml

      - name: Setup Gradle Wrapper and Build APK
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true --stacktrace

      - name: Send APK to Telegram
        if: success()
        env:
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          APP_TITLE: ${{ github.event.client_payload.app_name }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -n "\(BOT_TOKEN" ] && [ -f "\)APK_PATH" ]; then
            curl -F chat_id="$CHAT_ID" \
                 -F document=@"$APK_PATH" \
                 -F caption="✅ APK Berhasil Dikompilasi: $APP_TITLE" \
                 "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"
          fi

      - name: Notify Failure to Telegram
        if: failure()
        env:
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          if [ -n "$BOT_TOKEN" ]; then
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                 -d chat_id="$CHAT_ID" \
                 -d text="❌ Gagal mengompilasi APK. Cek detail error di log GitHub Actions."
          fi
